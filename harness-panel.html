// dalej płynie). Atrapy stawiają zmiany na "wczoraj", "6 dni temu" i na dni
// 1–6 miesiąca, zakładając, że to wszystko jest w bieżącym miesiącu i w
// przeszłości. Na początku miesiąca to nieprawda: 01.10.2026 harness padał w
// CI bez żadnej zmiany w kodzie ("wczoraj" było już wrześniem). Środek
// miesiąca daje ten sam wynik każdego dnia. Musi stać PRZED innymi skryptami.
(() => {
  const Prawdziwa = Date;
  const t = new Prawdziwa();
  const cel = new Prawdziwa(t.getFullYear(), t.getMonth(), 15, t.getHours(), t.getMinutes(), t.getSeconds());
  const przesuniecie = cel.getTime() - t.getTime();
  class Data extends Prawdziwa {
    constructor(...a) { if (a.length === 0) super(Prawdziwa.now() + przesuniecie); else super(...a); }
    static now() { return Prawdziwa.now() + przesuniecie; }
  }
  window.Date = Data;
})();
</script>

  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela, filtr) => {
      let rows = (window.__tabele[tabela] || []).slice();
      // Honorujemy proste "kolumna=eq.wartość" — bez tego kod, który polega
      // na zawężeniu po stronie bazy, sprawdza się tu na losowym zbiorze.
      String(filtr || "")
        .split("&")
        .filter(Boolean)
        .forEach((cz) => {
          const m = cz.match(/^([a-z_]+)=eq\.(.*)$/);
          if (!m) return;
          const [, kol, wartosc] = m;
          const w = decodeURIComponent(wartosc);
          rows = rows.filter((r) =>
            w === "true" || w === "false"
              ? Boolean(r[kol]) === (w === "true")
              : String(r[kol] ?? "") === w
          );
        });
      return rows;
    },
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async (tabela, id) => {
      window.__zapisy.push([tabela, id, "DELETE"]);
      return true;
    },
    patchByFilter: async (tabela, filtr, dane) => {
      window.__zapisy.push([tabela, filtr, dane]);
      return true;
    },
    // Zapis bez RETURNING (wiadomości od 0041). Ślad w __zapisy w tym samym
    // kształcie co post, żeby testy szukające wiadomości nie zależały od tego,
    // którą drogą poszła.
    dodajBezOdczytu: async (tabela, dane) => {

async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await fetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

          { id: "sw2", grafik_shift_id: "gz2", lokal: "Bułka i Jacek", date: dniTygodnia[3],
            author_user_id: "u1", author_user_name: "Ala", taker_user_id: "u3",
            taker_user_name: "Cezary", status: "przyjeta", typ: "zamiana",
            target_user_id: "u3", target_user_name: "Cezary", wzajemna_shift_id: "gz3" },
        ],
        // Zestaw wymagań obowiązujący od początku bieżącego miesiąca plus trzy
        // reguły: codzienna, tylko-w-weekend i taka bez dni tygodnia (null =
        // codziennie) — ta ostatnia jest pułapką przy edycji, bo formularz
        // trzyma tablicę dni, a null musi wrócić jako pełny tydzień.
        staffingRuleSets, setStaffingRuleSets,
        staffingRules, setStaffingRules,
        lokaleGodziny: [],
        // Wyjątek z własną regułą — ten sam formularz co wymagania zestawu,
        // ale z drugim, niezależnym stanem. Bez tego nie widać, czy edycja w

        grafikWyjatki: wyjatkiStartowe,
        budzetCele, setBudzetCele, budzetDni, setBudzetDni,
        weatherForecasts: [],
        dayLogs, setDayLogs, dayLogEntries, setDayLogEntries,
        dayLogTemplates, setDayLogTemplates,
        showMsg: (m, t) => console.log("showMsg:", t, m),
      };
      "setUsers setLokale setStanowiska setShifts setIssues setShiftEdits setAbsences setShiftSwaps setLokaleGodziny setGrafikWyjatki"
        .split(" ").forEach((k) => { props[k] = () => {}; });

      window.__stanSzablonow = dayLogTemplates;
      return h(MD, props);
    }

    ReactDOM.createRoot(document.getElementById("app")).render(h(Harness));

    // ------------------------------------------------------------------
    // Zapis karty pracownika — payload nie może nieść kolumn wyliczanych.
    //
    // Panel jest tu montowany w całości właśnie po to, żeby łapać błędy
    // powstające MIĘDZY warstwami. Ten jest tej klasy: kolumna dochodzi w
    // migracji, payload powstaje z rozsypania wiersza, a objawem jest "Błąd
    // zapisu pracownika" przy KAŻDEJ karcie — także takiej, której nikt nie
    // tknął w okolicy PIN-u.
    // ------------------------------------------------------------------
    let zdanych = 0, oblanych = 0;
    const wyniki = document.createElement("div");
    wyniki.style.cssText = "padding:8px 16px;font:12px ui-monospace,monospace;background:#F1EEEB";
    document.body.insertBefore(wyniki, document.getElementById("app"));
    const sprawdz = (nazwa, warunek, szczegol = "") => {
      const d = document.createElement("div");
      if (warunek) { zdanych++; d.textContent = "  OK   " + nazwa; d.style.color = "#2C6A4F"; }
      else { oblanych++; d.className = "zle"; d.style.color = "#DE3A22";
             d.textContent = "  ŹLE  " + nazwa + (szczegol ? " — " + szczegol : ""); }
      wyniki.appendChild(d);
    };
    const czekaj = (ms) => new Promise((r) => setTimeout(r, ms));
    // Najgłębszy element z danym tekstem — nazwiska i etykiety zakładek dzielą
    // element z ikoną (w harnessie "▪"), więc porównanie na równość nie trafia
    // w nic. Ta sama pułapka co w harness-kiosk.
    const klik = (tekst) => {
      // ⚠️ Szukamy po WSZYSTKICH elementach wewnątrz #app, nie po wybranej
      // liście tagów: nazwisko na liście pracowników siedzi w <p>, a lista
      // "button, div, span" (skopiowana z harness-kiosk) po cichu go omijała
      // i sprawdzian mówił "nie znalazłem Doroty", choć stała na ekranie.
      const kandydaci = [...document.getElementById("app").querySelectorAll("*")]
        .filter((e) => !["SCRIPT", "STYLE"].includes(e.tagName))
        .filter((e) => (e.textContent || "").includes(tekst));
      const cel = kandydaci.reverse()
        .find((e) => ![...e.children].some((c) => (c.textContent || "").includes(tekst)));
      if (!cel) throw new Error("nie znalazłem elementu: " + tekst);
      (cel.closest("button") || cel).dispatchEvent(new MouseEvent("click", { bubbles: true }));
    };

    (async () => {
      await czekaj(600);

      // ----------------------------------------------------------------
      // Pulpit według makiety (0.49.0): najpierw "Do zrobienia teraz",
      // potem liczby, potem panele. Liczba w "Wymaga decyzji" przy
      // "Cała sieć" MUSI równać się znaczkowi w menu, a szybkie ✓ przy
      // prostej korekcie idzie przez te same 6 s "Cofnij" co "Do decyzji".
      // ----------------------------------------------------------------
      try {
        const pulpit = document.querySelector("#app [data-pulpit]");
        sprawdz("Pulpit startuje od „Do zrobienia teraz”",
          !!pulpit && /Do zrobienia teraz[\s\S]*Liczby/.test(pulpit.textContent));
        const decyzje = pulpit && pulpit.querySelector("[data-wymaga-decyzji]");
        const naPulpicie = decyzje && decyzje.getAttribute("data-wymaga-decyzji");
        const znaczekMenu = (/(\d+)$/.exec([...document.querySelectorAll("#app aside button")]
          .map((x) => x.textContent).find((x) => x.includes("Zatwierdzanie zmian")) || "") || [])[1];
        sprawdz("„Wymaga decyzji” na Pulpicie = znaczek w menu",
          !!naPulpicie && naPulpicie === znaczekMenu, `pulpit ${naPulpicie}, znaczek ${znaczekMenu}`);
        sprawdz("kafelka „Do decyzji” już nie ma (liczbę mówi karta i znaczek)",
          ![...document.querySelectorAll("#app [data-kafelki] span")].some((x) => x.textContent === "Do decyzji"));
        sprawdz("cztery kafelki liczb",
          document.querySelectorAll("#app [data-kafelki] > div").length === 4);
        const miesiac = document.querySelector("#app [data-kafelek-miesiac]");
        sprawdz("koszt miesiąca liczy etat z umowy (nie „brak stawki” dla Bo)",
          !!miesiac && /koszt\s*[\d\u00A0 ]+\u00A0?zł/.test(miesiac.textContent),
          miesiac ? miesiac.textContent.slice(0, 120) : "");
        const zamknij = pulpit && pulpit.querySelector("[data-zamknij-wczoraj]");
        sprawdz("„Zamknij wczoraj” pokazuje lokale bez utargu z „Uzupełnij”, nie „Zamknij”",
          !!zamknij && /Utarg/.test(zamknij.textContent) && /Uzupełnij/.test(zamknij.textContent) &&
            ![...zamknij.querySelectorAll("button")].some((b) => b.textContent.trim() === "Zamknij"),
          zamknij ? zamknij.textContent.slice(0, 160) : "");

        sprawdz("licznik „Zamknij wczoraj” jest szary, nie czerwony",
          !!zamknij && ![...zamknij.querySelectorAll("h3 span")].some((x) => /DE3A22/.test(x.className)));
        const szybkie = [...document.querySelectorAll("#app [data-szybkie-zatwierdz]")];
        // Kierownik Bułki widzi ✓ tylko przy korekcie ze swojego lokalu (Ala),
        // korekty z Ceglanej (Bo) nie ma u niego ani na liście, ani z ✓.
        if (new URLSearchParams(location.search).get("rola") === "manager") {
          sprawdz("kierownik lokalu nie dostaje ✓ do cudzego lokalu",
            szybkie.length === 1 &&
              !szybkie.some((b) => b.closest("[data-sprawa]").textContent.startsWith("Bo")),
            szybkie.map((b) => b.closest("[data-sprawa]").textContent).join(" | "));
          throw null;
        }
        // Obie korekty w atrapie są proste (Ala: start 07:30, Bo: koniec 16:30);
        // ✓ ma mieć każda z nich, a sprawdzamy na Bo.
        const wierszBo = szybkie.map((b) => b.closest("[data-sprawa]"))
          .find((w) => w && w.textContent.startsWith("Bo"));
        sprawdz("prosta korekta ma ✓ i różnicę „+30 min” na Pulpicie",
          szybkie.length === 2 && !!wierszBo && /\+30 min/.test(wierszBo.textContent),
          szybkie.map((b) => b.closest("[data-sprawa]").textContent).join(" | "));
        const ptaszekBo = () => [...document.querySelectorAll("#app [data-szybkie-zatwierdz]")]
          .find((b) => b.closest("[data-sprawa]").textContent.startsWith("Bo"));
        if (wierszBo) {
          const przed = window.__zapisy.length;
          ptaszekBo().dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(300);
          sprawdz("✓ chowa sprawę, zmniejsza licznik i pokazuje „Cofnij”",
            !ptaszekBo() &&
              document.querySelector("#app [data-wymaga-decyzji]").getAttribute("data-wymaga-decyzji") ===
                String(Number(naPulpicie) - 1) &&
              !!document.querySelector("#app [data-pasek-cofnij]"));
          [...document.querySelectorAll("#app [data-pasek-cofnij] button")].pop()
            .dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(300);
          sprawdz("„Cofnij” na Pulpicie przywraca sprawę bez zapisu",
            !!ptaszekBo() && window.__zapisy.length === przed);
          ptaszekBo().dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(6800);
          const patch = window.__zapisy.slice(przed).find((z) => z[0] === "shifts" && z[1] === "sh3");
          sprawdz("po 6 s ✓ zapisuje zgłoszone godziny (koniec 16:30)",
            !!patch && new Date(patch[2].end_time).getHours() === 16 &&
              new Date(patch[2].end_time).getMinutes() === 30,
            JSON.stringify(patch && patch[2]));
        }
      } catch (e) {
        if (e) sprawdz("Pulpit: przebieg bez wyjątku", false, e.message);
      }

      // ----------------------------------------------------------------
      // Rejestr godzin według makiety (0.50.0): powrót do bieżącego
      // miesiąca, okno wpisu NA ŚRODKU (nie panel na całą wysokość), powód
      // wymagany przy zmianie, ślad w shift_edits i usuwanie z "Cofnij".
      // ----------------------------------------------------------------
      try {
        const menuR = (nazwa) => {
          const b = [...document.querySelectorAll("#app aside button")]
            .find((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim() === nazwa);
          if (!b) throw new Error("nie ma pozycji menu: " + nazwa);
          b.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        };
        const klikEl = (el) => el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        // Wpisy Gosi są z Ceglanej — kierownik Bułki ich nie widzi.
        if (new URLSearchParams(location.search).get("rola") === "manager") throw null;
        menuR("Rejestr Godzin"); await czekaj(400);
        const miesiac = () => (document.querySelector("#app [data-miesiac-rejestru]") || {}).textContent;
        const biezacy = miesiac();
        sprawdz("Rejestr: tabela z kolumnami Grafik i Fakt obok siebie",
          !!document.querySelector("#app [data-tabela-rejestru]") &&
            /Grafik\s*Fakt/.test(document.querySelector("#app [data-tabela-rejestru]").textContent));
        sprawdz("w bieżącym miesiącu nie ma przycisku „Bieżący miesiąc”",
          !document.querySelector("#app [data-biezacy-miesiac]"));
        klikEl(document.querySelector('#app [aria-label="Poprzedni miesiąc"]')); await czekaj(200);
        const powrot = document.querySelector("#app [data-biezacy-miesiac]");
        sprawdz("po cofnięciu miesiąca pojawia się „Bieżący miesiąc”", !!powrot && miesiac() !== biezacy);
        if (powrot) { klikEl(powrot); await czekaj(200); }
        sprawdz("„Bieżący miesiąc” wraca na bieżący", miesiac() === biezacy, miesiac());

        // Edycja: wiersz otwiera okno; bez powodu zapis nie wychodzi.
        const wiersz = document.querySelector('#app [data-wiersz-rejestru="shG1"]');
        klikEl(wiersz); await czekaj(300);
        const okno = document.querySelector("#app [data-wpis-godzin] form");
        const r = okno && okno.getBoundingClientRect();
        sprawdz("okno wpisu ma ograniczony rozmiar",
          !!r && (innerWidth < 768 ? r.width <= innerWidth : r.width <= 600 && r.height < innerHeight),
          r ? `${Math.round(r.width)}×${Math.round(r.height)}` : "brak okna");
        if (innerWidth >= 768 && r) {
          sprawdz("…i stoi na środku ekranu, nie przy prawej krawędzi",
            Math.abs(r.left + r.width / 2 - document.documentElement.clientWidth / 2) < 4 && r.top > 8,
            `left ${Math.round(r.left)}, top ${Math.round(r.top)}`);
        }
        const przed = window.__zapisy.length;
        klikEl([...okno.querySelectorAll('button[aria-label="+15 min"]')][0]); await czekaj(100);
        klikEl(okno.querySelector("[data-zapisz-wpis]")); await czekaj(300);
        sprawdz("zmiana godziny bez powodu: komunikat i nic nie zapisuje",
          !!document.querySelector("#app [data-blad-wpisu]") && window.__zapisy.length === przed);
        klikEl([...okno.querySelectorAll("button")].find((b) => b.textContent === "Błąd odbicia")); await czekaj(100);
        klikEl(okno.querySelector("[data-zapisz-wpis]")); await czekaj(500);
        const nowe = window.__zapisy.slice(przed);
        const patch = nowe.find((z) => z[0] === "shifts" && z[1] === "shG1");
        const slad = nowe.find((z) => z[0] === "shift_edits");
        sprawdz("z powodem zapisuje nowy start 10:15",
          !!patch && new Date(patch[2].start_time).getHours() === 10 &&
            new Date(patch[2].start_time).getMinutes() === 15, JSON.stringify(patch && patch[2]));
        sprawdz("…i zostawia ślad: kto, było → jest, powód",
          !!slad && slad[1].source === "manual_edit" && slad[1].reason === "Błąd odbicia" &&
            slad[1].old_start_time === "10:00" && slad[1].new_start_time === "10:15" &&
            slad[1].editor_name === "Roman", JSON.stringify(slad && slad[1]));
        sprawdz("okno zamyka się po zapisie", !document.querySelector("#app [data-wpis-godzin]"));

        // Usunięcie: wiersz znika od razu, "Cofnij" go przywraca bez DELETE.
        klikEl(document.querySelector('#app [data-wiersz-rejestru="shG2"]')); await czekaj(300);
        const przedUsun = window.__zapisy.length;
        klikEl(document.querySelector("#app [data-usun-wpis]")); await czekaj(300);
        sprawdz("„Usuń wpis” chowa wiersz i pokazuje „Cofnij”",
          !document.querySelector('#app [data-wiersz-rejestru="shG2"]') &&
            !!document.querySelector("#app [data-pasek-cofnij]"));
        klikEl([...document.querySelectorAll("#app [data-pasek-cofnij] button")].pop()); await czekaj(300);
        sprawdz("„Cofnij” przywraca wpis i nic nie kasuje",
          !!document.querySelector('#app [data-wiersz-rejestru="shG2"]') &&
            !window.__zapisy.slice(przedUsun).some((z) => z[2] === "DELETE"));

        // Grupowanie po pracowniku: nagłówek z sumą do wypłaty.
        klikEl(document.querySelector('#app [data-grupa="pracownik"]')); await czekaj(200);
        const gosia = document.querySelector('#app [data-osoba-rejestru="Gosia"]');
        sprawdz("„Pracownik”: nagłówek osoby z dniami i sumą",
          !!gosia && /Dni\s*6/.test(gosia.textContent) && /Suma\s*48,0/.test(gosia.textContent),
          gosia ? gosia.textContent : "");
        klikEl(document.querySelector('#app [data-grupa="dzien"]')); await czekaj(100);
      } catch (e) {
        if (e) sprawdz("Rejestr: przebieg bez wyjątku", false, e.message);
      }

      // ----------------------------------------------------------------
      // Aktywni (0.51.0): najpierw "Wymaga uwagi", "Zakończ" pyta o godzinę,
      // obie decyzje z 6 s "Cofnij".
      // ----------------------------------------------------------------
      const menuX = (nazwa) => {
        const b = [...document.querySelectorAll("#app aside button")]
          .find((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim() === nazwa);
        if (!b) throw new Error("nie ma pozycji menu: " + nazwa);
        b.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      };
      const klikX = (el) => el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      try {
        if (new URLSearchParams(location.search).get("rola") === "manager") throw null;
        menuX("Aktywni"); await czekaj(400);
        const uwaga = document.querySelector("#app [data-wymaga-uwagi]");
        sprawdz("Aktywni: „Wymaga uwagi” z osobą z grafiku bez wejścia",
          !!uwaga && !!uwaga.querySelector('[data-bez-wejscia="Filip"]') &&
            /brak wejścia/.test(uwaga.textContent) && !!uwaga.querySelector("[data-dopisz-wejscie]"));
        const wiersz = () => document.querySelector('#app [data-aktywny="shT"]');
        sprawdz("trwająca zmiana stoi w swoim lokalu z „zostało” i paskiem",
          !!wiersz() && !!wiersz().closest('[data-lokal-aktywnych="Ceglana"]') && /zostało/.test(wiersz().textContent));
        klikX(wiersz().querySelector("[data-zakoncz]")); await czekaj(200);
        const box = document.querySelector("#app [data-zakonczenie]");
        sprawdz("„Zakończ” pyta o godzinę (Teraz / Wg grafiku) zamiast kończyć od razu",
          !!box && /Teraz ·/.test(box.textContent) && /Wg grafiku · 23:59/.test(box.textContent) &&
            /Zakończ · /.test(box.querySelector("[data-godzina-ok]").textContent));
        const przed = window.__zapisy.length;
        klikX(box.querySelector("[data-godzina-ok]")); await czekaj(300);
        sprawdz("potwierdzenie chowa wiersz i daje „Cofnij”", !wiersz() && !!document.querySelector("#app [data-pasek-cofnij]"));
        klikX([...document.querySelectorAll("#app [data-pasek-cofnij] button")].pop()); await czekaj(300);
        sprawdz("„Cofnij” wraca bez zapisu", !!wiersz() && window.__zapisy.length === przed);
        klikX(wiersz().querySelector("[data-zakoncz]")); await czekaj(200);
        klikX(document.querySelector("#app [data-zakonczenie] [data-godzina-ok]")); await czekaj(200);
        // "Dopisz wejście" najpierw pyta o godzinę — samo kliknięcie nic nie zapisuje.
        const przedWejsciem = window.__zapisy.length;
        klikX(document.querySelector('#app [data-bez-wejscia="Filip"] [data-dopisz-wejscie]')); await czekaj(200);
        const boxW = document.querySelector('#app [data-bez-wejscia="Filip"] [data-dopisz-wejscie-godzina]');
        sprawdz("„Dopisz wejście” pyta o godzinę: wg grafiku albo teraz",
          !!boxW && /Wg grafiku · 00:01/.test(boxW.textContent) && /Teraz ·/.test(boxW.textContent) &&
            /Dopisz wejście · 00:01/.test(boxW.querySelector("[data-godzina-ok]").textContent) &&
            window.__zapisy.length === przedWejsciem);
        klikX(boxW.querySelector("[data-godzina-ok]")); await czekaj(6800);
        const nowe = window.__zapisy.slice(przed);
        const koniec = nowe.find((z) => z[0] === "shifts" && z[1] === "shT");
        const wejscie = nowe.find((z) => z[0] === "shifts" && typeof z[1] === "object" && z[1].user_id === "u7");
        sprawdz("po 6 s zapisuje koniec zmiany", !!koniec && !!koniec[2].end_time, JSON.stringify(koniec && koniec[2]));
        sprawdz("„Dopisz wejście” zakłada zmianę od godziny z grafiku, bez końca",
          !!wejscie && wejscie[1].end_time === null && new Date(wejscie[1].start_time).getMinutes() === 1 &&
            nowe.some((z) => z[0] === "shift_edits" && z[1].source === "manual_add"),
          JSON.stringify(wejscie && wejscie[1]));
        // Pasek podsumowania filtruje listę; drugie kliknięcie wraca do wszystkich.
        klikX(document.querySelector('#app [data-filtr-aktywnych="brak"]')); await czekaj(200);
        sprawdz("„bez wejścia” w pasku pokazuje tylko osoby bez wejścia",
          !!document.querySelector("#app [data-bez-wejscia]") && !document.querySelector("#app [data-aktywny]") &&
            document.querySelector('#app [data-filtr-aktywnych="brak"]').getAttribute("aria-pressed") === "true");
        klikX(document.querySelector('#app [data-filtr-aktywnych="zmiana"]')); await czekaj(200);
        sprawdz("„na zmianie” pokazuje tylko pracujących",
          !document.querySelector("#app [data-bez-wejscia]") && !!document.querySelector('#app [data-aktywny="shT"]'));
        klikX(document.querySelector('#app [data-filtr-aktywnych="lokal:Ceglana"]')); await czekaj(200);
        const panele = [...document.querySelectorAll("#app [data-lokal-aktywnych]")].map((x) => x.getAttribute("data-lokal-aktywnych"));
        const brakRows = [...document.querySelectorAll("#app [data-bez-wejscia]")];
        sprawdz("lokal w pasku zawęża do tego lokalu",
          panele.length > 0 && panele.every((x) => x === "Ceglana") &&
            brakRows.every((r) => r.textContent.includes("Ceglana")), panele.join(","));
        klikX(document.querySelector('#app [data-filtr-aktywnych="wszyscy"]')); await czekaj(200);
        sprawdz("„Wszyscy” zdejmuje filtr",
          !!document.querySelector('#app [data-aktywny="shT"]') && !!document.querySelector('#app [data-bez-wejscia="Filip"]'));
      } catch (e) {
        if (e) sprawdz("Aktywni: przebieg bez wyjątku", false, e.message);
      }

      // ----------------------------------------------------------------
      // Skrzynka (0.51.0) — Zgłoszenia i Powiadomienia w jednym, w menu
      // zaraz po Aktywnych, jeden licznik = "Do zrobienia".
      // ----------------------------------------------------------------
      try {
        const pozycje = [...document.querySelectorAll("#app aside button")]
          .map((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim());
        sprawdz("menu: Skrzynka zaraz po Aktywnych, bez Zgłoszeń i Powiadomień",
          pozycje.indexOf("Skrzynka") === pozycje.indexOf("Aktywni") + 1 &&
            !pozycje.includes("Zgłoszenia") && !pozycje.includes("Powiadomienia"), pozycje.join(" | "));
        if (new URLSearchParams(location.search).get("rola") === "manager") throw null;

      try {

        sprawdz("karta pracownika w ogóle się zapisuje", !!ostatni,

      // ----------------------------------------------------------------
      // Ustawienia (0.44.0) — lokale i stanowiska wyszły z Pracowników.
      //

      // jest budowany z jawnej listy — błąd #18), i że dodanie lokalu
      // otwiera od razu jego kartę, a nie pusty ekran.
      // ----------------------------------------------------------------
      const przyciskiOTekscie = (tekst) =>
        [...document.querySelectorAll("#app button")].filter(
          (b) => b.textContent.replace("▪", "").trim() === tekst);
      const wpisz = (input, wartosc) => {
        const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
        setter.call(input, wartosc);
        input.dispatchEvent(new Event("input", { bubbles: true }));
      };
      try {
        sprawdz("Pracownicy nie mają już pigułek Lokale/Stanowiska",
          przyciskiOTekscie("Stanowiska").length === 0);

        // ?rola=manager — kierownik lokalu. Ustawienia są tylko dla
        // właściciela, więc tu sprawdzamy wyłącznie, że ich nie widać.
        if (new URLSearchParams(location.search).get("rola") === "manager") {
          sprawdz("kierownik lokalu nie widzi zakładki Ustawienia",
            przyciskiOTekscie("Ustawienia").length === 0);

        sprawdz("właściciel widzi zakładkę Ustawienia",
          [...document.querySelectorAll("#app h2")].some((h) => h.textContent === "Ustawienia"));

        const karta = [...document.querySelectorAll("form")]
          .find((f) => /Płace i koszty/.test(f.textContent));
        sprawdz("karta lokalu otwiera się w sekcjach", !!karta);
        sprawdz("zwinięta sekcja płac mówi, co jest ustawione",
          !!karta && /okres 3 mies\. · narzut 20,5% \/ 0%/.test(karta.textContent),
          karta ? karta.textContent.slice(0, 200) : "");
        const przedZapisem = window.__zapisy.length;
        karta.requestSubmit();
        await czekaj(300);
        const zapisLokalu = window.__zapisy.slice(przedZapisem).find((z) => z[0] === "lokale");
        const dane = zapisLokalu && (zapisLokalu[2] || zapisLokalu[1]);
        sprawdz("zapis karty lokalu niesie pola zwiniętych sekcji",
          !!dane && dane.okres_rozliczeniowy === 3 && dane.narzut_umowa === 20.5,
          JSON.stringify(dane));
        sprawdz("zwinięta sekcja rejestracji mówi, jak się tu wpisuje godziny",
          /Tylko odbicie · start do 15 min po fakcie · koniec bez ograniczeń/.test(karta.textContent));
        sprawdz("zapis karty niesie sposób wpisu i okna (puste okno = null, nie 0)",
          !!dane && dane.tryb_wpisu === "odbicie" && dane.start_wstecz_min === 15 &&
            dane.koniec_wstecz_min === null,
          JSON.stringify(dane && { t: dane.tryb_wpisu, s: dane.start_wstecz_min, k: dane.koniec_wstecz_min }));

        const przedDodaniem = window.__zapisy.length;
        klik("Dodaj lokal"); await czekaj(300);
        const modal = [...document.querySelectorAll("form")]
          .find((f) => /Dodaj lokal/.test(f.textContent));

          !!modal && modal.querySelectorAll("input").length === 2,
          modal ? String(modal.querySelectorAll("input").length) : "brak modala");
        wpisz(modal.querySelector('input[type="text"]'), "Sunset");
        await czekaj(100);
        modal.requestSubmit();
        await czekaj(400);
        const nowy = window.__zapisy.slice(przedDodaniem).find((z) => z[0] === "lokale");
        sprawdz("nowy lokal zapisuje się z nazwą", !!nowy && nowy[1].name === "Sunset",

        // Układ z makiety (0.54.0): podsumowanie sekcji widać także po

        await czekaj(150);
        sprawdz("wyłączenie „Wpisów” pokazuje pasek zapisu i ostrzeżenie",
          !!U().querySelector("[data-pasek-zapisu-lokalu]") && /Bez „Wpisów”/.test(kartaL().textContent) &&

        [...U().querySelectorAll("[data-pasek-zapisu-lokalu] button")].find((x) => x.textContent.trim() === "Anuluj")
          .dispatchEvent(new MouseEvent("click", { bubbles: true }));

      // ----------------------------------------------------------------

      try {

          sprawdz("każda karta decyzji ma przyciski w rzędzie, równej wysokości",

          const kartaOdbicia = karty().find((k) => /Dopisz \d/.test(k.textContent));
          sprawdz("brak odbicia: przycisk mówi, ile godzin dopisze", !!kartaOdbicia);

            await czekaj(300);
            sprawdz("decyzja chowa kartę od razu i pokazuje „Cofnij”",

            sprawdz("…ale nic jeszcze nie zapisuje",

          const kartaAli3 = karty().find((d) => d.textContent.includes("07:30") && d.textContent.includes("Ala"));
          const zatwierdz = kartaAli3 && [...kartaAli3.querySelectorAll("button")]
            .find((b) => b.textContent.includes("Zatwierdź"));
          sprawdz("da się ją zatwierdzić jednym kliknięciem", !!zatwierdz);

            zatwierdz.dispatchEvent(new MouseEvent("click", { bubbles: true }));

            const nowe_ = window.__zapisy.slice(przed);

      // Pracownicy idą za lokalem z górnego paska (0.46.0).

      try {
        if (new URLSearchParams(location.search).get("rola") !== "manager") {
          const zakladkaLokalu = (nazwa) => {
            const b = [...document.querySelectorAll("#app header button")]
              .find((x) => x.textContent.trim() === nazwa);

          menu("Pracownicy"); await czekaj(400);
          zakladkaLokalu("Ceglana"); await czekaj(300);
          const ceglana = nazwiska();
          sprawdz("lokal z paska zawęża listę pracowników",
            ceglana.includes("Bo") && !ceglana.includes("Ala"), ceglana.join(", "));
          sprawdz("tablet z lokalem tylko w allowed_lokale zostaje na liście",
            ceglana.includes("Tablet Ceglana"), ceglana.join(", "));
          zakladkaLokalu("Cała sieć"); await czekaj(300);
          const wszyscy = nazwiska();
          const naglowki = [...document.querySelectorAll("#app [data-grupa-listy]")]
            .map((p) => p.getAttribute("data-grupa-listy"))

          // ----------------------------------------------------------------
          // Karta pracownika według makiety (0.52.0).

          const klikP = (el) => el.dispatchEvent(new MouseEvent("click", { bubbles: true }));

            !!grupaUrz && grupaUrz.parentElement.textContent.includes("Tablet Ceglana"));
          const wierszBo = document.querySelector('#app [data-osoba-listy="Bo"]');

          wpiszP(imie(), "Ala Nowak"); await czekaj(200);
          sprawdz("zmiana pola pokazuje pasek „Niezapisane zmiany”",

      // ----------------------------------------------------------------
      // Raporty i koszty według makiety (0.53.0): koszt jako główny kafelek,

      // prowadzi do osoby, a jej zmiany otwierają okno wpisu.
      // ----------------------------------------------------------------
      try {
        if (new URLSearchParams(location.search).get("rola") !== "manager") {
          const menuR = [...document.querySelectorAll("#app aside button")]
            .find((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim() === "Raporty i koszty");
          if (!menuR) throw new Error("nie ma pozycji menu Raporty i koszty");
          menuR.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(300);
          const R = () => document.querySelector("#app [data-raporty]");
          const MIES = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
          const pop = new Date(new Date().getFullYear(), new Date().getMonth() - 1, 1);
          sprawdz("Raporty startują na miesiącu zamkniętym",

          const koszt = () => R().querySelector("[data-kafelek-koszt]");
          // W poprzednim miesiącu atrapa ma Bo (etat 5 200 zł za 8 h) i zleceniowców

          const kwotaKosztu = () => Number(((/([\d\s\u00A0]+)\s*zł/.exec(koszt().textContent) || [])[1] || "0")
            .replace(/\D/g, ""));
          sprawdz("koszt poprzedniego miesiąca liczy etat Bo z umowy (≥ 5 200 zł)",
            !!koszt() && kwotaKosztu() >= 5200, koszt() ? koszt().textContent : "");
          sprawdz("pięć kafelków, koszt pracy pierwszy",
            R().querySelectorAll("[data-kafelki-raportu] > div").length === 5 &&
              R().querySelector("[data-kafelki-raportu] > div") === koszt());

          R().querySelector("[data-biezacy-miesiac]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          const got = R().querySelector("[data-gotowosc]");
          const punkt = (k) => got.querySelector(`[data-gotowosc-punkt="${k}"]`);
          sprawdz("bieżący miesiąc blokuje rozliczenie („Miesiąc jeszcze trwa”)",
            !!punkt("trwa") && punkt("trwa").getAttribute("data-stan") === "bad" &&
              Number(got.getAttribute("data-blokuje")) >= 1);
          sprawdz("brak wynagrodzenia blokuje i wymienia osobę (Cezary)",
            !!punkt("wynagrodzenia") && punkt("wynagrodzenia").getAttribute("data-stan") === "bad" &&
              /Cezary/.test(punkt("wynagrodzenia").textContent),
            punkt("wynagrodzenia") ? punkt("wynagrodzenia").textContent : "");
          sprawdz("kafelek kosztu mówi, że jest zaniżony",
            /Zaniżony/.test(koszt().textContent), koszt().textContent);
          sprawdz("„Wyślij do księgowej” jest wyłączone z powodem",
            [...R().querySelectorAll("button")].filter((b) => /Wyślij do księgowej/.test(b.textContent))
              .every((b) => b.disabled));
          sprawdz("wniosek o koncentracji kosztów przy dwóch lokalach",
            !!R().querySelector('[data-uwagi] [data-wniosek="koncentracja"]'));

          const grupa = R().querySelector('[data-grupa-kosztu="Ceglana"]');
          sprawdz("rozbicie po lokalu ma Ceglaną z udziałem i zł/h", !!grupa && /%/.test(grupa.textContent));
          grupa.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(150);
          const gosia = R().querySelector('[data-osoba-grupy="Gosia"]');
          sprawdz("rozwinięty lokal pokazuje osoby", !!gosia);
          gosia.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          const szcz = R().querySelector("[data-szczegoly-osoby]");

          await czekaj(100);

          szcz.querySelector("[data-wpis-raportu]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          sprawdz("zmiana w szczegółach otwiera okno wpisu", !!document.querySelector("#app [data-wpis-godzin]"));
          const anuluj = [...document.querySelectorAll("#app [data-wpis-godzin] button")]

        if (e !== null) sprawdz("Raporty i koszty: przebieg bez wyjątku", false, e.message);

      // ----------------------------------------------------------------
      // Grafik według makiety (0.55.0): pasek szkicu, etykiety obsady nad
      // dniem jako przyciski, panel przypisania z kandydatami i uwagami,
      // usuwanie z "Cofnij", szkic z "Cofnij" przy wierszu.
      // ----------------------------------------------------------------
      try {
        if (new URLSearchParams(location.search).get("rola") !== "manager") {
          const G = () => document.querySelector("#app [data-grafik]");
          const menuG = [...document.querySelectorAll("#app aside button")]
            .find((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim() === "Grafik");
          menuG.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(400);
          const liczbaPublikacji = () => Number((/Opublikuj · (\d+)/.exec(G().querySelector("[data-opublikuj]").textContent) || [])[1] || 0);
          const dzis = ymd(new Date());
          const oczekiwaneProsby = [dniTygodnia[2], dniTygodnia[3]].filter((d) => d >= dzis).length;
          sprawdz("pasek „Giełda zmian” pokazuje prośby czekające na zgodę",
            G().querySelectorAll("[data-prosba-gieldy]").length === oczekiwaneProsby,
            `jest ${G().querySelectorAll("[data-prosba-gieldy]").length}, oczekiwano ${oczekiwaneProsby}`);
          sprawdz("pasek szkicu i „Opublikuj · N” przy niewysłanych zmianach",
            !!G().querySelector("[data-pasek-szkicu]") && liczbaPublikacji() >= 1, String(liczbaPublikacji()));

          [...document.querySelectorAll("#app header button")].find((x) => x.textContent.trim() === "Ceglana")
            .dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(300);
          G().querySelector('[data-tryb-grafiku="edycja"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

          const sekcja = () => G().querySelector('[data-lokal-grafiku="Ceglana"]');
          const kafelekBrakow = Number(sekcja().querySelector("[data-kafelek-braki]").getAttribute("data-kafelek-braki"));
          sprawdz("kafelek „Braki obsady” = liczba czerwonych etykiet nad dniami",
            kafelekBrakow === sekcja().querySelectorAll("[data-obsada-dnia] [data-luka]").length && kafelekBrakow > 0,
            `kafelek ${kafelekBrakow}, etykiet ${sekcja().querySelectorAll("[data-obsada-dnia] [data-luka]").length}`);
          sprawdz("stopka powtarza dzień i datę z nagłówka",
            sekcja().querySelectorAll("[data-stopka-dnia]").length === 7 &&
              /pn/.test(sekcja().querySelector("[data-stopka-dnia]").textContent));
          sprawdz("zmiana usunięta po wysłaniu stoi przekreślona do publikacji",
            !!sekcja().querySelector('[data-zmiana-usunieta="g10"]'));

          const przedLuka = liczbaPublikacji();
          // Publikacja obejmuje dni od dziś — luka z przeszłości dałaby zmianę,
          // której licznik z założenia nie liczy.
          const luki = [...sekcja().querySelectorAll("[data-obsada-dnia] [data-luka]")];
          const dzienLuki = (l) => l.closest("[data-naglowek-dnia]").getAttribute("data-naglowek-dnia");
          const luka = luki.find((l) => dzienLuki(l) >= dzis) || luki[0];
          const lukaWPrzyszlosci = dzienLuki(luka) >= dzis;
          const [stLuki, odLuki, doLuki] = luka.getAttribute("data-luka").split("|");
          luka.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(300);
          const panel = () => document.querySelector("#app [data-panel-zmiany]");
          sprawdz("klik w lukę otwiera panel z jej godzinami i stanowiskiem",
            !!panel() && !!panel().querySelector(`[data-godzina-szybka="poczatek|${odLuki.slice(0, 5)}"]`) &&
              panel().querySelector(`[data-stanowisko-panelu="${stLuki}"]`).className.includes("bg-[#171714]"),
            panel() ? panel().textContent.slice(0, 160) : "brak panelu");
          const kandydat = [...panel().querySelectorAll("[data-kandydat]")].find((b) => !b.disabled && !b.hasAttribute("data-bez-stanowiska"));
          sprawdz("panel pokazuje kandydatów z godzinami w miesiącu", !!kandydat && /h/.test(kandydat.textContent));
          const szybkie = (k) => [...panel().querySelectorAll(`[data-godzina-szybka^="${k}|"]`)];
          sprawdz("szybkie godziny osobno dla początku i końca (z luką)",
            szybkie("poczatek").some((b) => b.textContent === odLuki.slice(0, 5)) &&
              szybkie("koniec").some((b) => b.textContent === doLuki.slice(0, 5)),
            szybkie("poczatek").map((b) => b.textContent).join(",") + " / " + szybkie("koniec").map((b) => b.textContent).join(","));
          sprawdz("osoby bez stanowiska schowane pod strzałką, dopóki się nie kliknie",
            !panel().querySelector("[data-bez-stanowiska]") && !!panel().querySelector("[data-rozwin-bez-stanowiska]"));
          panel().querySelector("[data-rozwin-bez-stanowiska]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(150);
          const szary = panel().querySelector("[data-bez-stanowiska]:not([disabled])");
          sprawdz("osoby bez tego stanowiska są na liście, na szaro, na końcu", !!szary &&
            [...panel().querySelectorAll("[data-kandydat]")].indexOf(szary) >
              [...panel().querySelectorAll("[data-kandydat]")].indexOf(kandydat));
          szary.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          sprawdz("wybór osoby bez stanowiska proponuje dopisanie go do karty",
            !!panel().querySelector("[data-dopisz-stanowisko]"));
          panel().querySelector(`[data-kandydat="${kandydat.getAttribute("data-kandydat")}"]`)
            .dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          // Dodatkowy dzień dolicza godziny TYLKO wybranej osobie.
          // Same GODZINY ("32/176 h"), bez znaczka uwag — uwagi Kodeksu liczą
          // się z zaznaczonymi dniami dla każdego kandydata (tak ma być), więc
          // dodany dzień potrafi zmienić je także u innych osób.
          const godzOsoby = (n) => {
            const t = panel().querySelector(`[data-kandydat="${n}"]`).lastElementChild.textContent;

          const inny = [...panel().querySelectorAll("[data-kandydat]")]

          const wolnyDzien = [...panel().querySelectorAll("[data-dzien-panelu]")].find((b) => !b.className.includes("bg-[#171714]"));

          const poW = godzOsoby(nazwaWybranej), poI = nazwaInnej ? godzOsoby(nazwaInnej) : "";
          sprawdz("zaznaczenie dnia dolicza godziny tylko wybranej osobie",
            poW !== przedW && (!nazwaInnej || poI === przedI),
            `[${nazwaWybranej}] ${przedW} → ${poW} / [${nazwaInnej}] ${JSON.stringify(przedI)} → ${JSON.stringify(poI)}`);
          panel().querySelector(`[data-dzien-panelu="${wolnyDzien.getAttribute("data-dzien-panelu")}"]`)
            .dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(150);
          sprawdz("wybór osoby pokazuje skutek dla obsady i uwagi",
            /Pokryje/.test(panel().querySelector("[data-skutek]").textContent) && !!panel().querySelector("[data-uwagi-zmiany]"),
            panel().querySelector("[data-skutek]").textContent);
          const przedZapisem = window.__zapisy.length;
          panel().querySelector("[data-zapisz-zmiane]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(400);
          const zapis = window.__zapisy.slice(przedZapisem).find((z) => z[0] === "grafik_shifts");
          const dz = zapis && (zapis[2] || zapis[1]);
          sprawdz("„Przypisz” zapisuje zmianę w godzinach luki",
            !!dz && dz.start_time === odLuki.slice(0, 5) && dz.end_time === doLuki.slice(0, 5) && dz.stanowisko === stLuki,
            JSON.stringify(dz));
          sprawdz("nowa zmiana w szkicu: przerywana ramka i +1 przy „Opublikuj”",
            !panel() && liczbaPublikacji() === przedLuka + (lukaWPrzyszlosci ? 1 : 0) && !!sekcja().querySelector('[data-stan="nowa"]'),
            `${przedLuka} → ${liczbaPublikacji()}`);
          sprawdz("zapis nie gubi zmian usuniętych w szkicu (stan, nie widok)",
            !!sekcja().querySelector('[data-zmiana-usunieta="g10"]'));

          sekcja().querySelector('[data-zmiana-grafiku="g8"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(300);
          sprawdz("zmiana z odpoczynkiem poniżej 11 h: uwagi i „Zapisz mimo uwag”",
            !!panel() && Number(panel().querySelector("[data-uwagi-zmiany]").getAttribute("data-uwagi-zmiany")) > 0 &&
              /mimo uwag/.test(panel().querySelector("[data-zapisz-zmiane]").textContent),
            panel() ? panel().querySelector("[data-zapisz-zmiane]").textContent : "");
          panel().querySelector('button[aria-label="Zamknij"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

          const przedUsun = window.__zapisy.length;
          sekcja().querySelector('[data-zmiana-grafiku="g4"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          panel().querySelector("[data-usun-zmiane]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          sprawdz("usunięcie chowa zmianę i daje 6 s „Cofnij”, bez zapisu od razu",
            !sekcja().querySelector('[data-zmiana-grafiku="g4"]') && !!G().querySelector("[data-pasek-cofnij]") &&
              window.__zapisy.length === przedUsun);
          [...G().querySelectorAll("[data-pasek-cofnij] button")][0].dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          sprawdz("„Cofnij” przywraca zmianę", !!sekcja().querySelector('[data-zmiana-grafiku="g4"]'));

          G().querySelector("[data-zobacz-szkic]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await czekaj(200);
          const szkic = document.querySelector("#app [data-szkic-grafiku]");
          sprawdz("szkic dzieli zmiany na dodane i usunięte, z listą osób do powiadomienia",
            // Luka z przeszłości (np. w niedzielę, gdy dziś nie ma braków) daje

          !!panelZ() && panelZ().querySelector('[data-kiedy="dni"]').className.includes("F6F5F1"));
        const sob = panelZ().querySelector('[data-dzien-wybor="6"]');
        sprawdz("dni spoza bloku (pon–pt) są wyłączone", !!sob && sob.disabled);
        kl(panelZ().querySelector('[data-kiedy="cykl"]'));
        await czekaj(100);
        n0 = window.__zapisy.length;
        kl(panelZ().querySelector("[data-zapisz-panel]"));
        await czekaj(300);
        const zapT = zapisyOd(n0, "tasks")[0];
        sprawdz("„Co N dni” zapisuje cykl i zdejmuje własne dni",
          !!zapT && zapT[1] === "zt6" && zapT[2].cycle_days === 7 && zapT[2].days_of_week === null, JSON.stringify(zapT));

        kl(Z().querySelector('[data-blok-cfg="Mycie okapu"] [data-edytuj-blok]'));
        await czekaj(200);
        n0 = window.__zapisy.length;
        kl(document.querySelector('#app [data-panel-zadan="blok"] [data-archiwizuj]'));
        await czekaj(200);
        sprawdz("archiwizacja bloku chowa go od razu, z „Cofnij”",
          !Z().querySelector('[data-blok-cfg="Mycie okapu"]') && !!document.querySelector("#app [data-pasek-cofnij]"));
        kl(document.querySelector("#app [data-pasek-cofnij] button"));
        await czekaj(200);
        sprawdz("„Cofnij” przy archiwizacji: blok wraca, nic nie poszło do bazy",
          !!Z().querySelector('[data-blok-cfg="Mycie okapu"]') && zapisyOd(n0, "task_blocks").length === 0 && zapisyOd(n0, "tasks").length === 0);
      } catch (e) {
        if (e !== null) sprawdz("Zadania: przebieg bez wyjątku", false, e.message + " " + (e.stack || "").split("\n")[1]);
      }

      // ----------------------------------------------------------------
      // Puls według makiety (0.57.0): karta dnia w trzech krokach (utarg i
      // tagi zapisują się same, kolejką), wpis w wierszu, zamknięcie z
      // potwierdzeniem, dzień zamknięty tylko do odczytu + poprawka,
      // lista dni, analityka, konfiguracja (prawo zamykania).
      // ----------------------------------------------------------------
      try {
        const P = () => document.querySelector("#app [data-puls-widok]");
        const kl = (el) => el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        const wpisz = (el, v) => {
          const proto = el.tagName === "TEXTAREA" ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
          Object.getOwnPropertyDescriptor(proto, "value").set.call(el, v);
          el.dispatchEvent(new Event("input", { bubbles: true }));
        };
        const opusc = (el) => el.dispatchEvent(new FocusEvent("focusout", { bubbles: true }));
        const zapisyOd = (n, tabela) => window.__zapisy.slice(n).filter((z) => z[0] === tabela);
        const menuP = [...document.querySelectorAll("#app aside button")]
          .find((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim() === "Puls");
        kl(menuP);
        await czekaj(300);
        const bulka = [...document.querySelectorAll("#app header button")].find((b) => b.textContent.trim() === "Bułka i Jacek");
        if (bulka) kl(bulka);
        await czekaj(250);
        // Na dziś: następny dzień aż do blokady.
        for (let i = 0; i < 3; i++) {
          const dalej = P().querySelector('button[aria-label="Następny dzień"]');
          if (!dalej || dalej.disabled) break;
          kl(dalej);
          await czekaj(150);
        }
        const K = () => P().querySelector("[data-karta-dnia]");
        sprawdz("Puls: karta dnia otwarta, cztery liczby nad krokami",
          !!K() && K().getAttribute("data-karta-dnia") === "otwarta" && K().querySelectorAll("[data-kafelek-pulsu]").length === 4,
          K() ? K().getAttribute("data-karta-dnia") : "brak karty");
        sprawdz("„Zamknij dzień” zablokowane bez utargu", !!K().querySelector("[data-zamknij-dzien]") && K().querySelector("[data-zamknij-dzien]").disabled);
        const lod = K().querySelector('[data-wpis-dnia="lodowka"]');
        sprawdz("wpis poza normą czerwony; sprawa z Zadań widoczna jako „w Moich zadaniach”",
          !!lod && lod.getAttribute("data-stan") === "poza" && (/w Moich zadaniach/.test(lod.textContent) || !!lod.querySelector("[data-do-zadan]")),
          lod ? lod.textContent.slice(0, 120) : "brak wiersza");

        // Wpis w wierszu.
        let n0 = window.__zapisy.length;
        const dost = () => K().querySelector('[data-wpis-dnia="dostawa"]');
        wpisz(dost().querySelector('[data-pole-wpisu="dostawca"]'), "Makro");
        await czekaj(80);
        kl(dost().querySelector("[data-zapisz-wpis]"));
        await czekaj(400);
        const wpisDost = zapisyOd(n0, "day_log_entries")[0];
        sprawdz("wpis dnia w wierszu zapisuje się od razu (bez okienka)",
          !!wpisDost && wpisDost[1].template_key === "dostawa" && wpisDost[1].payload.dostawca === "Makro" && dost().getAttribute("data-stan") === "ok",
          JSON.stringify(wpisDost));

        // Utarg i paragony — zapis po opuszczeniu pola, drugi zapis to PATCH.
        n0 = window.__zapisy.length;
        const obrot = K().querySelector('[data-pole-karty="obrot"]');
        wpisz(obrot, "5 480");
        await czekaj(60);
        opusc(K().querySelector('[data-pole-karty="obrot"]'));
        await czekaj(80);
        const par = K().querySelector('[data-pole-karty="liczba_paragonow"]');
        wpisz(par, "131");
        await czekaj(60);
        opusc(K().querySelector('[data-pole-karty="liczba_paragonow"]'));
        await czekaj(400);
        const karty1 = zapisyOd(n0, "day_logs");
        sprawdz("utarg zapisuje się sam: pierwszy zapis zakłada kartę, drugi ją poprawia (bez drugiej karty)",
          karty1.length === 2 && karty1[0].length === 2 && karty1[0][1].obrot === 5480 && karty1[1].length === 3 && karty1[1][2].liczba_paragonow === 131,
          JSON.stringify(karty1));
        sprawdz("po utargu: wyliczenie (koszt pracy) i odblokowane zamknięcie",
          !!K().querySelector("[data-wyliczenie-utargu]") && !K().querySelector("[data-zamknij-dzien]").disabled);
        n0 = window.__zapisy.length;
        kl(K().querySelector('[data-tag-dnia="deszcz"]'));
        await czekaj(300);
        const tagZ = zapisyOd(n0, "day_logs")[0];
        sprawdz("tag dnia zapisuje się kliknięciem", !!tagZ && tagZ[2] && tagZ[2].tagi === "deszcz", JSON.stringify(tagZ));

        // Zamknięcie z potwierdzeniem.
        kl(K().querySelector("[data-zamknij-dzien]"));
        await czekaj(150);
        sprawdz("„Zamknij dzień” pyta drugi raz", !!K().querySelector("[data-potwierdz-zamkniecie]"));
        n0 = window.__zapisy.length;
        kl(K().querySelector("[data-potwierdz-zamkniecie]"));
        await czekaj(500);
        const zamk = zapisyOd(n0, "day_logs")[0];
        sprawdz("zamknięcie zapisuje status, kto i utarg",
          !!zamk && zamk[2].status === "zamkniety" && zamk[2].closed_by === "Roman" && zamk[2].obrot === 5480, JSON.stringify(zamk));
        sprawdz("dzień zamknięty: tylko do odczytu", !!K() && K().getAttribute("data-karta-dnia") === "zamknieta" && !!K().querySelector("[data-tylko-odczyt]"));

        // Poprawka: ślad PIERWSZY, potem liczba.
        kl(K().querySelector('[data-poprawka="obrot"]'));
        await czekaj(200);
        const panelP = () => document.querySelector('#app [data-panel-boczny="poprawka"]');
        sprawdz("„Poprawka” otwiera panel z „Było” i powodem", !!panelP() && /5\s?480/.test(panelP().textContent));
        wpisz(panelP().querySelector("[data-nowa-wartosc]"), "5 600");
        await czekaj(60);
        kl(panelP().querySelector('[data-powod-poprawki="terminal doliczył później"]'));
        await czekaj(60);
        n0 = window.__zapisy.length;
        kl(panelP().querySelector("[data-wyslij-poprawke]"));
        await czekaj(500);
        const kol = window.__zapisy.slice(n0).filter((z) => z[0] === "day_log_entries" || z[0] === "day_logs");
        sprawdz("poprawka: najpierw ślad (korekta 5480 → 5600 z powodem), potem zmiana liczby",
          kol.length >= 2 && kol[0][0] === "day_log_entries" && kol[0][1].typ === "korekta" && kol[0][1].payload.stare === 5480 &&
            kol[0][1].payload.nowe === 5600 && /terminal/.test(kol[0][1].payload.powod) && kol[1][0] === "day_logs" && kol[1][2].obrot === 5600,
          JSON.stringify(kol));
        sprawdz("poprawka widoczna przy dniu (lista Poprawki + „poprawione”)",
          !!K().querySelector("[data-korekta-dnia]") && /poprawione/.test(K().querySelector('[data-pole-ro="obrot"]').textContent));

        // Dni, Analityka.
        kl(P().querySelector('[data-zakladka-pulsu="dni"]'));
        await czekaj(300);
        const dzisW = P().querySelector(`[data-wiersz-dnia="${ymd(new Date())}"]`);
        sprawdz("Dni: dzisiejszy wiersz zamknięty, z tagiem i poprawką",
          !!dzisW && dzisW.getAttribute("data-zamkniety") === "tak" && /deszcz/.test(dzisW.textContent) && /poprawka/.test(dzisW.textContent),
          dzisW ? dzisW.textContent.slice(0, 160) : "brak");
        kl(P().querySelector('[data-zakladka-pulsu="tydzien"]'));
        await czekaj(400);
        sprawdz("Analityka: siedem słupków i kafelki tygodnia",
          P().querySelectorAll("[data-slupek-dnia]").length === 7 && P().querySelectorAll("[data-kafelek-pulsu]").length === 4);

        // Konfiguracja: wpisy i prawo zamykania.
        kl(P().querySelector('[data-zakladka-pulsu="konfiguracja"]'));
        await czekaj(300);
        sprawdz("Konfiguracja: wpisy pogrupowane po porze", !!P().querySelector('[data-szablon-cfg="lodowka"]') && !!P().querySelector('[data-szablon-cfg="dostawa"]'));
        kl(P().querySelector('[data-zakladka-cfg-pulsu="kto"]'));
        await czekaj(200);
        const ala = P().querySelector('[data-bez-prawa="Ala"]');
        sprawdz("„Kto zamyka dzień”: osoba z lokalu z przyciskami Na dziś / Na tydzień", !!ala && !!ala.querySelector("[data-nadaj-tydzien]"));
        n0 = window.__zapisy.length;
        if (ala) kl(ala.querySelector("[data-nadaj-dzis]"));
        await czekaj(300);
        const prawo = zapisyOd(n0, "users")[0];
        sprawdz("„Na dziś” zapisuje puls_do = dziś i przenosi osobę do „Mogą zamykać”",
          !!prawo && prawo[2].puls_do === ymd(new Date()) && !!P().querySelector('[data-prawo-zamykania="Ala"]'), JSON.stringify(prawo));
      } catch (e) {
        if (e !== null) sprawdz("Puls: przebieg bez wyjątku", false, e.message + " " + (e.stack || "").split("\n")[1]);
      }

      // ----------------------------------------------------------------
      // Korekta "cała zmiana" bez shift_id dla osoby, która ma już start bez
      // końca (Natalia, 25.09.2026): zatwierdzenie ma DOPISAĆ koniec do
      // otwartej zmiany, a nie założyć drugiej. Wołane wprost, bez ekranu —
      // chodzi o resolveCorrection, wspólne dla "Do decyzji" i Pulpitu.
      try {
        const K = await import(await zaladuj("/src/utils/corrections"));
        const dzien = ymd(new Date());
        const start = new Date(dzien + "T09:00:00");
        window.__tabele.shifts = [
          { id: "shOtw", user_id: "uNat", user_name: "Natalia", lokal: "L1", stanowisko: "Bar",
            start_time: start.toISOString(), end_time: null, rozliczenie: null },
        ];
        const przed = window.__zapisy.length;
        await K.resolveCorrection({
          issue: { id: "issNat", user_id: "uNat", user_name: "Natalia", shift_id: null },
          shifts: [],
          editorName: "Kierownik",
          finalValues: { date: dzien, lokal: "L1", stanowisko: "Bar", start: "09:00", end: "18:00" },
        });
        const nowe = window.__zapisy.slice(przed);
        const patch = nowe.find((z) => z[0] === "shifts" && z[1] === "shOtw");
        sprawdz("korekta bez shift_id dopisuje koniec do otwartej zmiany",
          !!patch && new Date(patch[2].end_time).getHours() === 18, JSON.stringify(nowe.map((z) => z.slice(0, 2))));
        sprawdz("…i nie zakłada drugiej zmiany",
          !nowe.some((z) => z[0] === "shifts" && typeof z[1] === "object"));
        const slad = nowe.find((z) => z[0] === "shift_edits");
        sprawdz("…a ślad mówi, że poprawiono istniejącą (stary start 09:00)",
          !!slad && slad[1].shift_id === "shOtw" && slad[1].old_start_time === "09:00", JSON.stringify(slad && slad[1]));
      } catch (e) {
        sprawdz("Korekta na otwartą zmianę: przebieg bez wyjątku", false, e.message);
      } finally {
        window.__tabele.shifts = [];
      }

      if (status.className !== "zle") {
        status.textContent =
          `panel zamontowany — sprawdziany ${zdanych}/${zdanych + oblanych}`;
      }
    })();
  } catch (e) { pokazBlad(e); }
})();
</script>
