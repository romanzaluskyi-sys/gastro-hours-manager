<meta charset="utf-8">
<title>Panel Kierownika — pełny łańcuch</title>
<!-- Renderuje CAŁY ManagerDashboard z propsami takimi, jakie podaje App.tsx.
     Sprawdza to, czego dwa pozostałe harnessy nie mogą: czy props faktycznie
     dojeżdża przez wszystkie poziomy (App -> ManagerDashboard -> KartaDnia ->
     PulsSzablony), a nie tylko czy każdy komponent osobno się renderuje.

     api/supabase jest tu PODMIENIONE na atrapę, więc klikanie niczego nie
     zapisuje do produkcyjnej bazy — w odróżnieniu od harness-karta.html. -->
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #F1F1EE; }
  #status { padding: 8px 14px; background: #17120F; color: #fff; font: 12px ui-monospace, monospace; }
  #status.zle { background: #DE3A22; }
  pre { background: #fff; padding: 12px; font-size: 12px; overflow-x: auto; }
</style>
<div id="status">ładowanie…</div>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
const status = document.getElementById("status");
const pokazBlad = (e) => {
  console.error("HARNESS", (e && e.stack) || e);
  status.className = "zle";
  status.textContent = "BŁĄD: " + (e && e.message ? e.message : e);
  const pre = document.createElement("pre");
  pre.textContent = (e && e.stack) || String(e);
  document.getElementById("app").appendChild(pre);
};
window.addEventListener("error", (ev) => pokazBlad(ev.error || ev.message));
window.addEventListener("unhandledrejection", (ev) => pokazBlad(ev.reason));

const IKONY = ["AlertCircle", "AlertTriangle", "Archive", "ArchiveRestore", "ArrowLeft", "ArrowLeftRight", "ArrowRight", "BarChart3", "Bell", "BookOpen", "Briefcase", "Calendar", "CalendarCheck", "CalendarDays", "CalendarRange", "Check", "CheckCircle", "CheckCircle2", "ChevronDown", "ChevronLeft", "ChevronRight", "ChevronUp", "ClipboardCheck", "ClipboardList", "ClipboardPlus", "Clock", "Cloud", "Construction", "Copy", "CopyPlus", "Delete", "Download", "Edit2", "Eye", "FileText", "Flag", "HelpCircle", "History", "Home", "Info", "Lock", "LogIn", "LogOut", "Mail", "MapPin", "MoreHorizontal", "Palmtree", "Pencil", "Plus", "Printer", "RefreshCw", "Save", "Send", "SlidersHorizontal", "Trash2", "User", "UserPlus", "Users", "WifiOff", "X"];
const stub = (kod) => URL.createObjectURL(new Blob([kod], { type: "text/javascript" }));

// Atrapa Supabase — nic nie leci do sieci, każdy zapis wraca z wymyślonym id.
window.__zapisy = [];
const API_STUB = stub(`
  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela) => (window.__tabele[tabela] || []).slice(),
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async () => true,
    patchByFilter: async () => true,
  };
`);

const PAKIETY = {
  react: stub(`const R = window.React;
    export default R;
    export const useState = R.useState, useMemo = R.useMemo, useEffect = R.useEffect,
      useRef = R.useRef, useCallback = R.useCallback, Fragment = R.Fragment;`),
  "lucide-react": stub(
    `const ikona = (n) => (p) => window.React.createElement("span", { "data-ikona": n }, "▪");
     ` + IKONY.map((n) => `export const ${n} = ikona("${n}");`).join("\n")
  ),
};

const cache = new Map();
async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await fetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const wczoraj = ymd(new Date(Date.now() - 86400000));
const godz = (h) => { const d = new Date(wczoraj + "T00:00:00"); d.setHours(h); return d; };
// Poniedziałek bieżącego tygodnia i siedem dni od niego — plan grafiku musi
// trafić w tydzień, który siatka domyślnie pokazuje.
const poniedzialek = (() => {
  const d = new Date();
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return ymd(d);
})();
const dniTygodnia = Array.from({ length: 7 }, (_, i) => {
  const d = new Date(poniedzialek + "T00:00:00");
  d.setDate(d.getDate() + i);
  return ymd(d);
});
const opub = { published_at: "2020-01-01T00:00:00Z", deleted_at: null };
const miesiacOd = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, "0")}-01`;
const zestawyStartowe = [
  { id: "zs1", lokal: "Ceglana", obowiazuje_od: miesiacOd, created_by: "Roman" },
  { id: "zs2", lokal: "Bułka i Jacek", obowiazuje_od: miesiacOd, created_by: "Roman" },
];
// Trzy reguły, w tym jedna BEZ dni tygodnia (null = codziennie) — to pułapka
// przy edycji: formularz trzyma tablicę dni, więc null musi wrócić jako pełny
// tydzień, a nie jako brak zaznaczeń.
const wyjatkiStartowe = [
  { id: "wy1", lokal: "Ceglana", date_from: dniTygodnia[5], date_to: dniTygodnia[5],
    zamkniete: false, open_time: "12:00", close_time: "23:00", note: "Wesele na sali",
    created_by: "Roman" },
];
const regulyStartowe = [
  { id: "sr1", set_id: "zs1", wyjatek_id: null, stanowisko: "Kucharz",
    days_of_week: "1,2,3,4,5", start_time: "09:00", end_time: "17:00", required_count: 2 },
  { id: "sr2", set_id: "zs1", wyjatek_id: null, stanowisko: "Kelner",
    days_of_week: "6,0", start_time: "14:00", end_time: "19:00", required_count: 1 },
  { id: "sr3", set_id: "zs1", wyjatek_id: null, stanowisko: "Kucharz",
    days_of_week: null, start_time: "17:00", end_time: "22:00", required_count: 1 },
  { id: "sr4", set_id: null, wyjatek_id: "wy1", stanowisko: "Kelner",
    days_of_week: null, start_time: "16:00", end_time: "23:00", required_count: 4 },
];
const planTygodnia = [
  { id: "g1", user_id: "u1", user_name: "Ala", lokal: "Bułka i Jacek",
    stanowisko: "Kucharz", date: dniTygodnia[0], start_time: "10:00", end_time: "18:00", ...opub },
  { id: "g2", user_id: "u1", user_name: "Ala", lokal: "Bułka i Jacek",
    stanowisko: "Kucharz", date: dniTygodnia[2], start_time: "10:00", end_time: "18:00", ...opub },
  { id: "g3", user_id: "u2", user_name: "Bo", lokal: "Ceglana",
    stanowisko: "Kucharz", date: dniTygodnia[1], start_time: "08:00", end_time: "16:00", ...opub },
  { id: "g4", user_id: "u3", user_name: "Cezary", lokal: "Ceglana",
    stanowisko: "Kelner", date: dniTygodnia[4], start_time: "12:00", end_time: "20:00", ...opub },
  // Druga zmiana tego samego dnia — w wydruku "osoby × dni" kratka rośnie o
  // kolejną trójkę zamiast chować drugą zmianę.
  { id: "g5", user_id: "u3", user_name: "Cezary", lokal: "Ceglana",
    stanowisko: "Kucharz", date: dniTygodnia[4], start_time: "21:00", end_time: "23:30", ...opub },
  // Bo jest z Ceglanej, ale ten dzień robi w Bułce — w wydruku Ceglanej ma
  // być widoczny (to jego lokal macierzysty, miesiąc musi być kompletny),
  // a w wydruku Bułki NIE, bo Bułka nie prowadzi jego grafiku.
  { id: "g6", user_id: "u2", user_name: "Bo", lokal: "Bułka i Jacek",
    stanowisko: "Kucharz", date: dniTygodnia[2], start_time: "10:00", end_time: "18:00", ...opub },
  // Ala odwrotnie: z Bułki, wyjątkowo jeden dzień w Ceglanej. W Ceglanej
  // pokazujemy TYLKO ten jeden dzień.
  { id: "g7", user_id: "u1", user_name: "Ala", lokal: "Ceglana",
    stanowisko: "Kelner", date: dniTygodnia[6], start_time: "14:00", end_time: "22:00", ...opub },
  // Bo jest na umowie o pracę i ma już wtorek 08:00–16:00 — ta zmiana zostawia
  // 6 h przerwy, czyli poniżej 11 h z art. 132. Do sprawdzania ostrzeżeń
  // Kodeksu w siatce i w modalu.
  { id: "g8", user_id: "u2", user_name: "Bo", lokal: "Ceglana",
    stanowisko: "Kucharz", date: dniTygodnia[1], start_time: "22:00", end_time: "06:00", ...opub },
  // Ewa jest na zleceniu — Kodeks jej nie obejmuje, więc jedyne, co ma
  // zobaczyć kierownik, to seria: 6 dni × 8 h = 48 h bez dnia wolnego.
  ...Array.from({ length: 6 }, (_, i) => ({
    id: `g9${i}`, user_id: "u5", user_name: "Ewa", lokal: "Ceglana",
    stanowisko: "Kelner", date: dniTygodnia[i], start_time: "09:00", end_time: "17:00", ...opub,
  })),
];

const poprzedniMiesiac = (h) => {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); d.setDate(10); d.setHours(h, 0, 0, 0);
  return d;
};

(async () => {
  try {
    const MD = (await import(await zaladuj("/src/components/ManagerDashboard"))).default;
    const { useState, createElement: h } = React;

    function Harness() {
      // Stan trzymany tak jak w App.tsx — dzięki temu widać, czy setter
      // faktycznie dociera i czy lista rośnie po zapisie.
      const [dayLogTemplates, setDayLogTemplates] = useState([]);
      const [dayLogs, setDayLogs] = useState([]);
      const [dayLogEntries, setDayLogEntries] = useState([]);
      // Prawdziwy stan, nie zaślepka: bez tego widać tylko, ŻE poszedł zapis,
      // a nie czy lista po nim pokazuje nową wartość — a to jest właśnie ten
      // rodzaj błędu, dla którego ten harness powstał.
      const [planShifts, setPlanShifts] = useState(planTygodnia);
      const [staffingRules, setStaffingRules] = useState(regulyStartowe);
      const [staffingRuleSets, setStaffingRuleSets] = useState(zestawyStartowe);

      const props = {
        currentUser: { id: "u0", name: "Roman", role: "admin", allowed_lokale: "" },
        setCurrentView: () => {},
        users: [
          // Zlecenie — stawka godzinowa, koszt = godziny × stawka.
          { id: "u1", name: "Ala", stawka: 32, typ_umowy: "zlecenie", active: true,
            archived: false, role: "open", default_lokal: "Bułka i Jacek",
            default_stanowisko: "Kucharz" },
          // Umowa o pracę — norma z kalendarza, koszt = kwota z umowy.
          { id: "u2", name: "Bo", typ_umowy: "umowa_o_prace", wymiar_etatu: 1,
            wynagrodzenie_mies: 5200, active: true, archived: false, role: "closed",
            email: "bo@x.pl", pin: "123456", default_lokal: "Ceglana",
            default_stanowisko: "Kucharz" },
          // Pół etatu i pusta kwota — karta ma pokazać normę, ale nie koszt.
          { id: "u3", name: "Cezary", typ_umowy: "umowa_o_prace", wymiar_etatu: 0.5,
            active: true, archived: false, role: "closed", email: "c@x.pl", pin: "123456",
            default_lokal: "Ceglana", default_stanowisko: "Kucharz" },
          // Nic nie wypełnione — nie może wywrócić karty ani pokazać zmyślonej liczby.
          { id: "u4", name: "Dorota", active: true, archived: false, role: "open",
            default_lokal: "Ceglana" },
          // Stare konto: typ umowy siedzi jeszcze w kolumnie `etat`.
          { id: "u5", name: "Ewa", etat: "zlecenie", stawka: 31.4, active: true,
            archived: false, role: "open", default_lokal: "Ceglana" },
        ],
        lokale: [
          { id: "l1", name: "Bułka i Jacek", miasto: "Koszalin", archived: false },
          { id: "l2", name: "Ceglana", miasto: "Koszalin", archived: false,
            okres_rozliczeniowy: 3, narzut_umowa: 20.5, narzut_zlecenie: 0, dzien_wyplaty: 10 },
        ],
        stanowiska: [
          { id: "s1", name: "Kucharz", lokal_name: "Bułka i Jacek", archived: false },
          { id: "s2", name: "Kucharz", lokal_name: "Ceglana", archived: false },
          { id: "s3", name: "Kelner", lokal_name: "Ceglana", archived: false },
        ],
        shifts: [
          { id: "sh1", user_id: "u1", user_name: "Ala", lokal: "Bułka i Jacek", stanowisko: "Kucharz",
            start_time: godz(8), end_time: godz(16) },
          // Bo w poprzednim miesiącu — żeby bilans okresu miał zamknięty miesiąc.
          { id: "sh2", user_id: "u2", user_name: "Bo", lokal: "Ceglana", stanowisko: "Kucharz",
            start_time: poprzedniMiesiac(8), end_time: poprzedniMiesiac(16) },
          { id: "sh3", user_id: "u2", user_name: "Bo", lokal: "Ceglana", stanowisko: "Kucharz",
            start_time: godz(8), end_time: godz(16) },
        ],
        issues: [], notifications: [], shiftEdits: [], tasks: [], taskCompletions: [],
        // Plan na bieżący tydzień — bez niego siatka Grafiku jest pusta i nie
        // widać ani szerokości kolumn, ani wykorzystania normy w wierszu.
        planShifts, setPlanShifts,
        absences: [
          // Jeden dzień zablokowany, żeby dało się sprawdzić pomijanie dni
          // przy wpisywaniu tej samej zmiany na kilka dni naraz.
          { id: "ab1", user_id: "u2", user_name: "Bo", lokal: "Ceglana",
            start_date: dniTygodnia[3], end_date: dniTygodnia[3], type: "urlop",
            status: "approved" },
        ],
        shiftSwaps: [],
        // Zestaw wymagań obowiązujący od początku bieżącego miesiąca plus trzy
        // reguły: codzienna, tylko-w-weekend i taka bez dni tygodnia (null =
        // codziennie) — ta ostatnia jest pułapką przy edycji, bo formularz
        // trzyma tablicę dni, a null musi wrócić jako pełny tydzień.
        staffingRuleSets, setStaffingRuleSets,
        staffingRules, setStaffingRules,
        lokaleGodziny: [],
        // Wyjątek z własną regułą — ten sam formularz co wymagania zestawu,
        // ale z drugim, niezależnym stanem. Bez tego nie widać, czy edycja w
        // jednym miejscu nie miesza się z drugim.
        grafikWyjatki: wyjatkiStartowe,
        weatherForecasts: [],
        dayLogs, setDayLogs, dayLogEntries, setDayLogEntries,
        dayLogTemplates, setDayLogTemplates,
        showMsg: (m, t) => console.log("showMsg:", t, m),
      };
      "setUsers setLokale setStanowiska setShifts setIssues setNotifications setShiftEdits setTasks setTaskCompletions setAbsences setShiftSwaps setLokaleGodziny setGrafikWyjatki"
        .split(" ").forEach((k) => { props[k] = () => {}; });

      window.__stanSzablonow = dayLogTemplates;
      return h(MD, props);
    }

    ReactDOM.createRoot(document.getElementById("app")).render(h(Harness));
    setTimeout(() => {
      if (status.className !== "zle") status.textContent = "panel zamontowany";
    }, 400);
  } catch (e) { pokazBlad(e); }
})();
</script>
