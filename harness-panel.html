window.__zapisy = [];
const API_STUB = stub(`
  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela, filtr) => {
      let rows = (window.__tabele[tabela] || []).slice();
      // Honorujemy proste "kolumna=eq.wartość" — bez tego kod, który polega
      // na zawężeniu po stronie bazy, sprawdza się tu na losowym zbiorze.
      String(filtr || "")
        .split("&")
        .filter(Boolean)
        .forEach((cz) => {
          const m = cz.match(/^([a-z_]+)=eq\.(.*)$/);
          if (!m) return;
          const [, kol, wartosc] = m;
          const w = decodeURIComponent(wartosc);
          rows = rows.filter((r) =>
            w === "true" || w === "false"
              ? Boolean(r[kol]) === (w === "true")
              : String(r[kol] ?? "") === w
          );
        });
      return rows;
    },
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async () => true,
    patchByFilter: async () => true,
  };
`);

window.__moduly = cache;
async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await fetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

          JSON.stringify(nowy));
        sprawdz("po dodaniu od razu otwiera się karta nowego lokalu",
          [...document.querySelectorAll("form h3")].some((h) => h.textContent === "Sunset"));
      } catch (e) {
        if (e !== null) sprawdz("Ustawienia: przebieg bez wyjątku", false, e.message);
      }

      // ----------------------------------------------------------------
      // Prośba o sam start (0.45.0). Do tej wersji korekta bez końca miała
      // tylko "Zapytaj", a zatwierdzona inną drogą wpisywała end_time = null,
      // czyli otwierała zakończoną zmianę i zerowała jej godziny.
      // ----------------------------------------------------------------
      try {
        if (new URLSearchParams(location.search).get("rola") !== "manager") {
          klik("Zatwierdzanie zmian"); await czekaj(400);
          const kartaAli = [...document.querySelectorAll("#app div.rounded-xl")]
            .find((d) => d.textContent.includes("07:30") && d.textContent.includes("Ala")
              && d.querySelector("button"));
          sprawdz("prośba o start stoi w kolejce korekt", !!kartaAli);

          // Jeden układ karty dla każdego typu decyzji (0.46.0): przyciski
          // jeden pod drugim, a pierwszy zawsze "na tak".
          const karty = [...document.querySelectorAll("#app div.rounded-xl")]
            .filter((d) => d.querySelector(":scope > div.grid"));
          const kolumny = karty.map((k) => k.querySelector(":scope > div.grid > div.flex-col"));
          sprawdz("każda karta decyzji ma przyciski w kolumnie",
            karty.length >= 3 && kolumny.every(Boolean),
            `kart ${karty.length}, bez kolumny ${kolumny.filter((k) => !k).length}`);
          const pierwsze = kolumny.filter(Boolean)
            .map((k) => (k.querySelector("button") || {}).textContent || "");
          sprawdz("pierwszy przycisk w każdej karcie to decyzja „na tak”",
            pierwsze.length > 0 && pierwsze.every((x) => !/Odrzuć|Nie było/.test(x)),
            pierwsze.join(" | "));
          sprawdz("pokazuje obecny koniec zmiany, nie „brak”",
            !!kartaAli && /07:30\s*–\s*16:00/.test(kartaAli.textContent),
            kartaAli ? kartaAli.textContent.slice(0, 160) : "");
          const zatwierdz = kartaAli && [...kartaAli.querySelectorAll("button")]
            .find((b) => b.textContent.includes("Zatwierdź"));
          sprawdz("da się ją zatwierdzić jednym kliknięciem", !!zatwierdz);
          if (zatwierdz) {
            const przed = window.__zapisy.length;
            zatwierdz.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            await czekaj(500);
            const patch = window.__zapisy.slice(przed)
              .find((z) => z[0] === "shifts" && z[1] === "sh1");
            const nowe = patch && patch[2];
            sprawdz("zatwierdzenie przestawia start na 07:30",
              !!nowe && new Date(nowe.start_time).getHours() === 7 &&
                new Date(nowe.start_time).getMinutes() === 30,
              JSON.stringify(nowe));
            sprawdz("…i ZOSTAWIA koniec 16:00 (zmiana się nie otwiera)",
              !!nowe && !!nowe.end_time && new Date(nowe.end_time).getHours() === 16 &&
                nowe.godzin === 8.5,
              JSON.stringify(nowe));
          }
        }
      } catch (e) {
        sprawdz("Korekta startu: przebieg bez wyjątku", false, e.message);
      }

      // ----------------------------------------------------------------
      // Pracownicy idą za lokalem z górnego paska (0.46.0).
      // ----------------------------------------------------------------
      try {
        if (new URLSearchParams(location.search).get("rola") !== "manager") {
          const zakladkaLokalu = (nazwa) => {
            const b = [...document.querySelectorAll("#app header button")]
              .find((x) => x.textContent.trim() === nazwa);
            if (!b) throw new Error("nie ma zakładki lokalu: " + nazwa);
            b.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          };
          const nazwiska = () =>
            [...document.querySelectorAll("#app button > p:first-child")]
              .filter((p) => p.className.includes("text-[15px]"))
              .map((p) => p.textContent.trim());
          // Menu ma w nazwie licznik ("Pracownicy8"), a strona Zatwierdzania
          // ma nagłówek "Pracownicy na próbę" — klik(tekst) trafiłby w niego.
          const menu = (nazwa) => {
            const b = [...document.querySelectorAll("#app aside button")]
              .find((x) => x.textContent.replace(/▪/g, "").replace(/\d+$/, "").trim() === nazwa);
            if (!b) throw new Error("nie ma pozycji menu: " + nazwa);
            b.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          };
          // Znaczek przy "Zatwierdzanie zmian" = nagłówek strony "Do decyzji · N".
          menu("Zatwierdzanie zmian"); await czekaj(300);
          const naglowekStrony = (/Do decyzji · (\d+)/.exec(
            [...document.querySelectorAll("#app h2")].map((h) => h.textContent).join(" ")) || [])[1];
          const znaczek = (/(\d+)$/.exec([...document.querySelectorAll("#app aside button")]
            .map((x) => x.textContent).find((x) => x.includes("Zatwierdzanie zmian")) || "") || [])[1];
          sprawdz("znaczek w menu = liczba decyzji na stronie",
            !!naglowekStrony && naglowekStrony === znaczek,
            `strona ${naglowekStrony}, znaczek ${znaczek}`);
          menu("Pracownicy"); await czekaj(400);
          zakladkaLokalu("Ceglana"); await czekaj(300);
          const ceglana = nazwiska();
          sprawdz("lokal z paska zawęża listę pracowników",
            ceglana.includes("Bo") && !ceglana.includes("Ala"), ceglana.join(", "));
          sprawdz("tablet z lokalem tylko w allowed_lokale zostaje na liście",
            ceglana.includes("Tablet Ceglana"), ceglana.join(", "));
          zakladkaLokalu("Cała sieć"); await czekaj(300);
          const wszyscy = nazwiska();
          const naglowki = [...document.querySelectorAll("#app p")]
            .filter((p) => p.className.includes("uppercase") &&
              ["Bułka i Jacek", "Ceglana"].includes(p.textContent.trim()))
            .map((p) => p.textContent.trim());
          sprawdz("„Cała sieć” pokazuje wszystkich, pogrupowanych po lokalu",
            wszyscy.includes("Ala") && wszyscy.includes("Bo") &&
              naglowki.join("|") === "Bułka i Jacek|Ceglana",
            `${wszyscy.join(", ")} / nagłówki: ${naglowki.join("|")}`);
        }
      } catch (e) {
        sprawdz("Pracownicy wg lokalu: przebieg bez wyjątku", false, e.message);
      }

      if (status.className !== "zle") {
        status.textContent =
          `panel zamontowany — sprawdziany ${zdanych}/${zdanych + oblanych}`;
      }
    })();
  } catch (e) { pokazBlad(e); }
})();
</script>
