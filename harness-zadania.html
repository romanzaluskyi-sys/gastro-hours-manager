// Ten sam loader co w harness-dziennik.html.
const cache = new Map();
async function zaladuj(sciezka) {
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = new Promise(async (resolve, reject) => {
    try {
      let kod = null;
      for (const ext of [".ts", ".tsx", ""]) {
        const r = await fetch(sciezka + ext + "?cb=" + Date.now());
        if (r.ok) { kod = await r.text(); break; }
      }
      if (kod === null) throw new Error("nie znaleziono " + sciezka);
      const specyfikatory = [...kod.matchAll(/from\s+"(\.[^"]+)"/g)].map((m) => m[1]);
      const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
      const mapa = {};
      for (const s of specyfikatory) {
        const url = new URL(baza + "/" + s, location.origin).pathname;
        mapa[s] = await zaladuj(url);
      }
      kod = kod.replace(/from\s+"(\.[^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
      const js = Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }]] }).code;
      resolve(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
    } catch (e) { reject(e); }
  });
  cache.set(sciezka, p);
  return p;
}

      author_user_id: "u1", author_user_name: "Ala", typ: "zamiana",
      target_user_id: "u4", target_user_name: "Dorota", wzajemna_shift_id: "p3" };
    sprawdz("zamiana: adresat widzi ofertę mimo własnej zmiany tego dnia",
      widzi([ofertaZamiany], dorota).includes("s3"),
      "bo dzień zwalnia właśnie ta zmiana, którą oddaje");
    sprawdz("wzajemna zmiana odnaleziona po id",
      S.wzajemnaZmiana(ofertaZamiany, plan).id === "p3");

    // Godziny: przy zamianie obie strony i biorą, i oddają.
    const mies = D1.slice(0, 7);
    const przyjeta = { ...ofertaZamiany, status: "przyjeta", taker_user_id: "u4",
      taker_user_name: "Dorota" };
    const deltaDoroty = S.pendingSwapDelta([przyjeta], plan, dorota, mies);
    sprawdz("zamiana 8 h za 8 h to zero różnicy", Math.abs(deltaDoroty) < 0.001,
      "policzenie samej przejmowanej zmiany dałoby +8 h z niczego");
    const przyjeteOddanie = { ...ofertaDlaBo, status: "przyjeta", taker_user_id: "u2",
      taker_user_name: "Bo" };
    sprawdz("oddanie: przejmujący zyskuje 8 h",
      Math.abs(S.pendingSwapDelta([przyjeteOddanie], plan, bo, mies) - 8) < 0.001);
    sprawdz("oddanie: autor traci 8 h",
      Math.abs(S.pendingSwapDelta([przyjeteOddanie], plan, ala, mies) + 8) < 0.001);

    sprawdz("etykieta stanu mówi, na kogo się czeka",
      S.statusLabelFor(ofertaDlaBo) === "Czeka na: Bo");
    sprawdz("etykieta giełdy bez zmian", S.statusLabelFor(ofertaGieldy) === "Na giełdzie");
    sprawdz("stary wiersz bez kolumny typ to giełda", S.typWymiany({}) === "gielda");

    let odmowa = "";
    try {
      await S.acceptSwap({ swap: ofertaDlaBo, planShift: zmianaAli, taker: dorota,
        planShifts: plan, absences: wolne });
    } catch (e) { odmowa = e.message; }
    sprawdz("cudzej oferty skierowanej nie da się przejąć", /innej osobie/.test(odmowa),
      "filtr w UI to za mało — zapis musi bronić się sam");

    log("");
    log(`ZDANYCH ${zdanych}, OBLANYCH ${oblanych}`, oblanych ? "zle" : "ok");
  } catch (e) {
    log("BŁĄD: " + (e && e.message), "zle");
    const pre = document.createElement("pre");
    pre.textContent = (e && e.stack) || String(e);
    out.appendChild(pre);
  }
})();
</script>
