// --- loader ES (src/) — ten sam co w harness-budzet.html ----------------
const cache = new Map();
async function zaladuj(sciezka) {
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = new Promise(async (resolve, reject) => {
    try {
      let kod = null;
      for (const ext of [".ts", ".tsx", ""]) {
        const r = await fetch(sciezka + ext + "?cb=" + Date.now());
        if (r.ok) { kod = await r.text(); break; }
      }
      if (kod === null) throw new Error("nie znaleziono " + sciezka);
      const specyfikatory = [...kod.matchAll(/from\s+"(\.[^"]+)"/g)].map((m) => m[1]);
      const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
      const mapa = {};
      for (const s of specyfikatory) {
        mapa[s] = await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
      }
      kod = kod.replace(/from\s+"(\.[^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
      const js = Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }]] }).code;
      resolve(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
    } catch (e) { reject(e); }
  });
  cache.set(sciezka, p);
  return p;
}

// --- loader CommonJS (api/) ---------------------------------------------
// `require` zna tylko ścieżki względne i "crypto"; process.env i Buffer są
// podane z zewnątrz, bo moduły czytają zmienne przy ładowaniu.
const ENV = {
  SUPABASE_URL: "https://baza.test",
  SUPABASE_SERVICE_KEY: "klucz-serwisowy",
  CRON_SECRET: "sekret",
  BREVO_API_KEY: "klucz-brevo",
  EMAIL_FROM: "powiadomienia@shiftro.pl",
  APP_URL: "https://app.test/",
  REACT_APP_TENANT: "Gastro Test",
};
const cryptoStub = {
  createHmac: (alg, klucz) => ({
    update: (t) => ({ digest: () => btoa(unescape(encodeURIComponent(`${klucz}|${t}`))) }),
  }),
  timingSafeEqual: (a, b) => a.s === b.s,
};
const BufferStub = { from: (s) => ({ s: String(s), length: String(s).length }) };
const cjsCache = new Map();
async function cjs(sciezka) {
  if (cjsCache.has(sciezka)) return cjsCache.get(sciezka);
  const kod = await (await fetch(sciezka + "?cb=" + Date.now())).text();
  const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
  const mapa = {};
  for (const [, d] of kod.matchAll(/require\("(\.[^"]+)"\)/g)) {
    mapa[d] = await cjs(new URL(baza + "/" + d + (d.endsWith(".js") ? "" : ".js"), location.origin).pathname);
  }
  const module = { exports: {} };
  const req = (n) => (n === "crypto" ? cryptoStub : mapa[n]);
  new Function("module", "exports", "require", "process", "Buffer", kod)(
    module, module.exports, req, { env: ENV }, BufferStub
  );
  cjsCache.set(sciezka, module.exports);
  return module.exports;
}

// --- atrapa Supabase i Brevo --------------------------------------------
const stan = { tabele: {}, maile: [], patche: [], raporty: new Set(), brevo: () => ({ status: 201 }) };
const odp = (status, body) =>
  new Response(status === 204 ? null : typeof body === "string" ? body : JSON.stringify(body), { status });
window.fetch = ((prawdziwy) => async (url, opcje = {}) => {
  const u = new URL(url, location.origin);
  if (u.origin === location.origin) return prawdziwy(url, opcje);
  const metoda = opcje.method || "GET";
  if (u.host === "api.brevo.com") {
    const body = JSON.parse(opcje.body);
    const r = stan.brevo(body);
    if (r.status < 300) stan.maile.push(body);
    return odp(r.status, r.status < 300 ? { messageId: "m" + stan.maile.length } : { message: "odmowa" });
  }
  const tabela = u.pathname.split("/rest/v1/")[1];
  const wiersze = stan.tabele[tabela] || [];
  const p = u.searchParams;
  if (metoda === "GET") {
    let w = wiersze;
    // Filtry, od których zależy wynik w endpointach; reszta zawęża już kod.
    for (const [k, v] of p.entries()) {
      if (["select", "order", "limit", "or"].includes(k)) continue;
      if (v === "is.null") w = w.filter((r) => r[k] == null);
      else if (v === "not.is.null") w = w.filter((r) => r[k] != null);
      else if (v === "not.is.true") w = w.filter((r) => r[k] !== true);
      else if (v.startsWith("eq.")) w = w.filter((r) => String(r[k]) === v.slice(3));
      else if (v.startsWith("gt.")) w = w.filter((r) => r[k] != null && String(r[k]) > v.slice(3));
      else if (v.startsWith("gte.")) w = w.filter((r) => r[k] != null && String(r[k]) >= v.slice(4));
      else if (v.startsWith("lte.")) w = w.filter((r) => r[k] != null && String(r[k]) <= v.slice(4));
      else if (v.startsWith("lt.")) w = w.filter((r) => r[k] != null && String(r[k]) < v.slice(3));
    }
    if (tabela === "notifications" && p.get("email_at") === "is.null") {
      w = w.filter((r) => r.audience == null || r.audience === "employee");
    }
    return odp(200, w);
  }
  if (metoda === "PATCH") {
    const body = JSON.parse(opcje.body);
    stan.patche.push({ tabela, filtr: u.search, body });
    const id = (p.get("id") || "").replace(/^eq\./, "");
    wiersze.filter((r) => !id || String(r.id) === id).forEach((r) => {
      if (tabela === "notifications" && !id) {
        // masowe zamknięcie starych — tylko wiersze z email_at null i starsze
        const granica = (p.getAll("created_at")[0] || "").replace(/^lt\./, "");
        if (r.email_at || !(r.created_at < granica)) return;
      }
      if (p.get("email_at") === "is.null" && r.email_at) return;
      Object.assign(r, body);
    });
    return odp(204, "");
  }
  if (metoda === "POST" && tabela === "notifications") {
    (stan.tabele.notifications = stan.tabele.notifications || []).push(JSON.parse(opcje.body));
    return odp(201, "");
  }
  if (metoda === "POST" && tabela === "email_raporty") {
    const body = JSON.parse(opcje.body);
    const klucz = `${body.user_id}|${body.rodzaj}|${body.okres}`;
    if (stan.raporty.has(klucz)) return odp(409, { message: "duplicate key" });
    stan.raporty.add(klucz);
    return odp(201, "");
  }
  return odp(400, { message: `atrapa nie zna ${metoda} ${tabela}` });
})(window.fetch.bind(window));

const zadanie = (query = {}, auth = "Bearer sekret") => ({

const odpowiedz = () => {

  r.json = (j) => { r.json = j; return r; };
  r.send = (t) => { r.tresc = t; return r; };
  r.setHeader = (k, v) => { r.naglowki[k] = v; };
  return r;
};

    r = odpowiedz();
    await ustawienia({ method: "POST", query: { u: "p1", t: podpis("p1") }, headers: {}, body: { akcja: "wlacz" } }, r);
    sprawdz("„Włącz z powrotem”", stan.tabele.users[3].email_powiadomienia === true);
    r = odpowiedz();
    await ustawienia({ method: "POST", query: { u: "p1", t: podpis("p2") }, headers: {}, body: {} }, r);
    sprawdz("cudzy podpis = 403", r.kod === 403);

    // --- endpoint: koniec-pracy (0.70.1) --------------------------------
    log(""); log("— api/cron/koniec-pracy —");
    const dzisW = C.ymd();
    stan.tabele = {
      notifications: [],
      grafik_shifts: [
        { id: "z1", user_id: "o1", date: C.dodajDni(dzisW, 2), deleted_at: null },
        { id: "z2", user_id: "o1", date: C.dodajDni(dzisW, 3), deleted_at: null },
        { id: "z3", user_id: "o1", date: C.dodajDni(dzisW, -5), deleted_at: null },
      ],
      users: [
        { id: "o1", name: "Odchodzi", active: true, archived: false, default_lokal: "Ceglana", ostatni_dzien: C.dodajDni(dzisW, -1) },
        { id: "o2", name: "Ostatni Dziś", active: true, archived: false, default_lokal: "Ceglana", ostatni_dzien: dzisW },
        { id: "o3", name: "Już Wyłączony", active: false, archived: false, ostatni_dzien: C.dodajDni(dzisW, -10) },
        { id: "o4", name: "W Archiwum", active: true, archived: true, ostatni_dzien: C.dodajDni(dzisW, -10) },
        { id: "o5", name: "Bez Daty", active: true, archived: null },
        { id: "o6", name: "Tablet", active: true, archived: null, allowed_lokale: "Sunset", ostatni_dzien: C.dodajDni(dzisW, -3) },
      ],
    };
    r = odpowiedz();
    await koniecPracy(zadanie({}, "Bearer zly"), r);
    sprawdz("koniec-pracy: zły sekret = 401", r.kod === 401);
    r = odpowiedz();
    await koniecPracy(zadanie(), r);
    const ku = (id) => stan.tabele.users.find((u) => u.id === id);
    sprawdz("dzień po ostatnim dniu: nieaktywny, NIE w archiwum", ku("o1").active === false && ku("o1").archived === false);
    sprawdz("ostatni dzień = dziś: jeszcze aktywny", ku("o2").active === true);
    sprawdz("zarchiwizowanego nie ruszamy, bez daty też", ku("o4").active === true && ku("o5").active === true);
    sprawdz("archived = null traktowane jak nie w archiwum", ku("o6").active === false);
    sprawdz("kierownik lokalu dostaje wiadomość (lokal z allowed_lokale, gdy brak default)",
      stan.tabele.notifications.length === 2 &&
        stan.tabele.notifications.every((n) => n.audience === "manager" && n.type === "koniec_pracy") &&
        stan.tabele.notifications.some((n) => n.lokal === "Sunset"),
      JSON.stringify(stan.tabele.notifications.map((n) => n.lokal)));
    sprawdz("wiadomość mówi, ile zmian zostało w Grafiku po ostatnim dniu",
      /zostały 2 zmiany po tej dacie/.test((stan.tabele.notifications.find((n) => /Odchodzi/.test(n.message)) || {}).message || ""));
    sprawdz("odpowiedź wymienia wyłączonych", JSON.stringify(r.json.wylaczone) === JSON.stringify(["Odchodzi", "Tablet"]), JSON.stringify(r.json));

    log("");
    log(`ZDANYCH ${zdanych}, OBLANYCH ${oblanych}`, oblanych ? "zle" : "ok");
  } catch (e) {
    log("WYJĄTEK: " + (e && e.message ? e.message : e), "zle");
    const pre = document.createElement("pre");
    pre.textContent = (e && e.stack) || String(e);
    out.appendChild(pre);
  }
})();
</script>
