const status = document.getElementById("status");
const pokazBlad = (e) => {
  console.error("HARNESS", (e && e.stack) || e);
  status.className = "zle";
  status.textContent = "BŁĄD: " + (e && e.message ? e.message : e);
  const pre = document.createElement("pre");
  pre.textContent = (e && e.stack) || String(e);
  document.getElementById("app").appendChild(pre);
};
window.addEventListener("error", (ev) => pokazBlad(ev.error || ev.message));
window.addEventListener("unhandledrejection", (ev) => pokazBlad(ev.reason));

const IKONY = ["AlertCircle", "AlertTriangle", "Archive", "ArchiveRestore", "ArrowLeft", "ArrowLeftRight", "ArrowRight", "BarChart3", "Bell", "BookOpen", "Briefcase", "Calendar", "CalendarCheck", "CalendarDays", "CalendarRange", "Check", "CheckCircle", "CheckCircle2", "ChevronDown", "ChevronLeft", "ChevronRight", "ChevronUp", "ClipboardCheck", "ClipboardList", "ClipboardPlus", "Clock", "Cloud", "Construction", "Copy", "CopyPlus", "Delete", "Download", "Edit2", "Eye", "FileText", "Flag", "HelpCircle", "History", "Home", "Hourglass", "Info", "ListChecks", "Lock", "LogIn", "LogOut", "Mail", "MapPin", "MoreHorizontal", "Palmtree", "Pencil", "Plus", "Printer", "RefreshCw", "RotateCcw", "Save", "Send", "Settings", "SlidersHorizontal", "Thermometer", "Trash2", "User", "UserPlus", "Users", "Wallet", "WifiOff", "X"];

window.__zapisy = [];
const API_STUB = stub(`
  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela) => (window.__tabele[tabela] || []).slice(),
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async () => true,
    patchByFilter: async () => true,
    // ⚠️ Odpowiedzi ustawia TEST, nie atrapa. PIN blokady sprawdza od 0.42.1
    // baza (RPC \`sprawdz_kiosk_pin\`), więc tablet nie ma już z czego
    // wywnioskować odpowiedzi sam — i dokładnie o to chodziło.
    rpc: async (nazwa, args) => {
      window.__rpcWywolania.push([nazwa, args]);
      const f = window.__rpcOdpowiedzi[nazwa];
      if (!f) throw new Error("atrapa nie zna funkcji " + nazwa);
      return f(args);
    },
  };
  window.__rpcWywolania = [];
  window.__rpcOdpowiedzi = {
    sprawdz_kiosk_pin: (a) => a.p_user_id === "u4" && a.p_pin === "123456",
    // Od migracji 0029 tablet nie ma prawa zapisu do \`users\` — osobę na
    // próbę zakłada funkcja w bazie, która sama pilnuje warunków.
    dodaj_probnego: (a) => ({

      default_lokal: a.p_lokal, default_stanowisko: a.p_stanowisko,
      email: "", pin: "", active: true, archived: false,
      probny_status: "oczekuje", probny_od: "2026-09-22", probny_przez: a.p_przez,
    }),
  };
`);

const PAKIETY = {
  react: stub(`const R = window.React;
    export default R;
    export const useState = R.useState, useMemo = R.useMemo, useEffect = R.useEffect,
      useRef = R.useRef, useCallback = R.useCallback, Fragment = R.Fragment;`),
  "lucide-react": stub(
    `const ikona = (n) => (p) => window.React.createElement("span", { "data-ikona": n }, "▪");
     ` + IKONY.map((n) => `export const ${n} = ikona("${n}");`).join("\n")
  ),
};

const cache = new Map();
async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await fetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

(async () => {

    const { useState, createElement: h } = React;

    function Harness() {

      // Lista osób musi być stanem, bo tablet sam ją uzupełnia: osoba dodana

        // ⚠️ BEZ \`kiosk_pin\`. Od 0.42.1 tablet nie dostaje PIN-u z bazy i ma

    // ------------------------------------------------------------------
    let zdanych = 0, oblanych = 0;

             d.textContent = "  ŹLE  " + nazwa + (szczegol ? " — " + szczegol : ""); }

    const czekaj = (ms) => new Promise((r) => setTimeout(r, ms));
    const widac = (tekst) => (document.getElementById("app").innerText || "").includes(tekst);
    // ⚠️ Szukamy NAJGŁĘBSZEGO elementu z danym tekstem, a nie równego mu.
    // Imię na liście dzieli element z ikoną kłódki (w harnessie ikony to
    // "▪"), więc porównanie na równość nie trafia w nic — pierwsza wersja
    // tego sprawdzianu wywracała się właśnie tu.
    const klik = (tekst) => {
      const kandydaci = [...document.querySelectorAll("button, [role=button], div, span")]
        .filter((e) => (e.textContent || "").includes(tekst));
      const cel = kandydaci
        .reverse()
        .find((e) => ![...e.children].some((c) => (c.textContent || "").includes(tekst)));
      if (!cel) throw new Error("nie znalazłem elementu: " + tekst);
      (cel.closest("button") || cel).dispatchEvent(new MouseEvent("click", { bubbles: true }));
    };
    // Cyfry osobno: "1" zawiera się w "1234" i w połowie ekranu, więc tu
    // musi być równość, i to na samym przycisku klawiatury.
    const klikCyfre = (c) => {
      const cel = [...document.querySelectorAll("button")]
        .find((e) => (e.textContent || "").trim() === c);
      if (!cel) throw new Error("nie znalazłem cyfry: " + c);
      cel.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    };
    const wpisz = async (cyfry) => {
      for (const c of cyfry) { klikCyfre(c); await czekaj(30); }
    };

    (async () => {
      try {
        await czekaj(500);
        sprawdz("lista osób się pokazała", widac("Dorota"));

        klik("Dorota"); await czekaj(200);
        sprawdz("osoba z PIN-em prowadzi do klawiatury", widac("Ten profil jest zablokowany"));

        // ⚠️ Żadnego przycisku zatwierdzania. PIN ma sześć cyfr i zatwierdza
        // się sam — przy urządzeniu obsługiwanym jedną ręką w biegu każde
        // dodatkowe dotknięcie jest kosztem płaconym kilkanaście razy dziennie.
        sprawdz("nie ma przycisku zatwierdzania", !widac("Otwórz"));

        // Niepełny PIN nie może niczego otworzyć ani wywołać błędu — dopóki
        // nie ma sześciu cyfr, ekran po prostu czeka.
        await wpisz("1234"); await czekaj(400);
        sprawdz("cztery cyfry nic nie robią", widac("Ten profil jest zablokowany") && !widac("Niepoprawny"));

        await wpisz("56"); await czekaj(500);
        sprawdz("szósta cyfra otwiera sama", !widac("Ten profil jest zablokowany"),
          (document.getElementById("app").innerText || "").slice(0, 60));

        // ⚠️ PIN sprawdziła BAZA, nie przeglądarka. Wiersz Doroty w ogóle nie
        // zawiera \`kiosk_pin\` — gdyby tablet dalej porównywał u siebie,
        // otwarcie profilu nie miałoby prawa się udać.
        const ostatnie = window.__rpcWywolania[window.__rpcWywolania.length - 1];
        sprawdz("PIN sprawdziła baza, nie przeglądarka",
          !!ostatnie && ostatnie[0] === "sprawdz_kiosk_pin",
          JSON.stringify(window.__rpcWywolania));
        sprawdz("zapytanie niesie osobę i wpisane cyfry",
          !!ostatnie && ostatnie[1].p_user_id === "u4" && ostatnie[1].p_pin === "123456",
          JSON.stringify(ostatnie && ostatnie[1]));

        // --- zły PIN, też sześciocyfrowy ---
        klik("Zmień"); await czekaj(300);
        klik("Dorota"); await czekaj(200);
        await wpisz("999999"); await czekaj(500);
        sprawdz("zły PIN nie wpuszcza i mówi o tym", widac("Niepoprawny PIN"));
        await czekaj(1000);
        sprawdz("po błędzie kropki same się czyszczą", widac("Ten profil jest zablokowany"));

        // Siódma cyfra nie ma gdzie wejść — inaczej po błędzie dałoby się
        // wpisywać w nieskończoność i zatwierdzenie nigdy by nie wypadło.
        const ileWywolan = window.__rpcWywolania.length;
        await wpisz("9999999"); await czekaj(500);
        const poSiodmej = window.__rpcWywolania[window.__rpcWywolania.length - 1];
        sprawdz("po sześciu cyfrach klawiatura nie przyjmuje więcej",
          window.__rpcWywolania.length === ileWywolan + 1 &&
            poSiodmej[1].p_pin.length === 6,
          JSON.stringify(poSiodmej && poSiodmej[1]));

        // --- zerwane połączenie ---
        //
        // ⚠️ Najważniejszy przypadek na tym ekranie: PIN jest POPRAWNY, a
        // profil się nie otwiera, bo wi-fi w kuchni padło. Komunikat
        // "niepoprawny PIN" kazałby człowiekowi wpisywać w kółko coś, co jest
        // dobre, i po trzech próbach iść po kierownika.
        await czekaj(1000);
        const dobre = window.__rpcOdpowiedzi.sprawdz_kiosk_pin;
        window.__rpcOdpowiedzi.sprawdz_kiosk_pin = () => {
          throw new Error("Failed to fetch");
        };
        await wpisz("123456"); await czekaj(500);
        sprawdz("brak sieci nie udaje złego PIN-u", !widac("Niepoprawny PIN"),
          (document.getElementById("app").innerText || "").slice(0, 200));
        sprawdz("brak sieci mówi, gdzie szukać przyczyny", widac("sprawdź połączenie"));
        sprawdz("profil zostaje zamknięty przy błędzie", widac("Ten profil jest zablokowany"));
        window.__rpcOdpowiedzi.sprawdz_kiosk_pin = dobre;

        // --- wiersz sprzed migracji 0027 ---
        await czekaj(1000);
        klik("Zmień"); await czekaj(300);
        klik("Cezary"); await czekaj(300);
        sprawdz("profil bez PIN-u wchodzi od razu bez pytania",
          !widac("Ten profil jest zablokowany"),
          (document.getElementById("app").innerText || "").slice(0, 120));

        // --- okno tolerancji wpisu (0.45.0) ---
        //
        // Spóźniony start nie przepada: zmiana zaczyna się TERAZ, a wcześniejsza
        // godzina idzie do kierownika jako korekta przypięta do tej zmiany.
        const hhmm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
        const ustawCzas = (input, wartosc) => {
          Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value")
            .set.call(input, wartosc);
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new Event("change", { bubbles: true }));
        };
        const zakladka = [...document.querySelectorAll("button")]
          .find((b) => b.textContent.replace(/▪/g, "").trim() === "Zmiana");
        if (!zakladka) throw new Error("nie znalazłem zakładki Zmiana");
        zakladka.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        await czekaj(300);
        sprawdz("formularz mówi z góry, gdzie jest granica",
          widac("Start możesz sam cofnąć najwyżej o 15 min"));
        const godzinaTemu = new Date(Date.now() - 60 * 60000);
        ustawCzas(document.querySelector('input[type="time"]'), hhmm(godzinaTemu));
        await czekaj(200);
        const przedStartem = window.__zapisy.length;
        klik("Rozpocznij zmianę"); await czekaj(300);
        sprawdz("start sprzed godziny: okno zamiast zapisu",
          widac("Za późno na samodzielny wpis") &&
            window.__zapisy.slice(przedStartem).length === 0,
          JSON.stringify(window.__zapisy.slice(przedStartem).map((z) => z[0])));
        klik("Rozpocznij i wyślij do kierownika"); await czekaj(500);
        const noweZapisy = window.__zapisy.slice(przedStartem);
        const zmianaZapis = noweZapisy.find((z) => z[0] === "shifts");
        const korektaZapis = noweZapisy.find((z) => z[0] === "issues");
        const startZapisany = zmianaZapis && new Date(zmianaZapis[1].start_time);
        sprawdz("zmiana zaczyna się teraz, nie godzinę temu",
          !!startZapisany && Math.abs(startZapisany - Date.now()) < 2 * 60000,
          startZapisany ? startZapisany.toISOString() : "brak zapisu shifts");
        sprawdz("wcześniejszy start idzie do kierownika jako korekta tej zmiany",
          !!korektaZapis && korektaZapis[1].type === "correction" &&
            korektaZapis[1].proposed_start_time === hhmm(godzinaTemu) &&
            !korektaZapis[1].proposed_end_time &&
            String(korektaZapis[1].shift_id).startsWith("fake-"),
          JSON.stringify(korektaZapis && korektaZapis[1]));

        // Koniec w przyszłości to nie spóźnienie — tylko wyjaśnienie, nic nie
        // idzie do kierownika.
        const zaGodzine = new Date(Date.now() + 60 * 60000);
        const poleKonca = [...document.querySelectorAll('input[type="time"]')].pop();
        const przedKoncem = window.__zapisy.length;
        ustawCzas(poleKonca, hhmm(zaGodzine));
        await czekaj(300);
        sprawdz("koniec za godzinę: „tej godziny jeszcze nie było”, bez zapisu",
          widac("Tej godziny jeszcze nie było") &&
            window.__zapisy.length === przedKoncem,
          JSON.stringify(window.__zapisy.slice(przedKoncem).map((z) => z[0])));
        klik("Rozumiem"); await czekaj(200);

        // --- nowa osoba na próbę ---
        //
        // ⚠️ Tablet NIE MOŻE pisać do \`users\` (migracja 0029) — zakłada konto
        // przez funkcję w bazie. Gdyby ktoś wrócił do INSERT-a, na produkcji
        // wyszłoby to rano, przy człowieku stojącym przy tablecie na dzień
        // próbny, i wyglądałoby na awarię tabletu.
        klik("Zmień"); await czekaj(300);
        klik("Nowa osoba na próbę"); await czekaj(300);
        const pole = document.querySelector('input[placeholder="np. Anna Kowalska"]');
        sprawdz("ekran nowej osoby się otwiera", !!pole);
        if (pole) {
          const setter = Object.getOwnPropertyDescriptor(
            window.HTMLInputElement.prototype, "value").set;
          setter.call(pole, "Testowa Osoba");
          pole.dispatchEvent(new Event("input", { bubbles: true }));
          await czekaj(200);
          // Stanowisko startuje puste i bez niego przycisk jest wyłączony —
          // lokal i stanowisko są tu wymagane, tak samo jak w karcie
          // pracownika u kierownika.
          const selekty = [...document.querySelectorAll("select")];
          const selStanowisko = selekty[selekty.length - 1];
          const setSel = Object.getOwnPropertyDescriptor(
            window.HTMLSelectElement.prototype, "value").set;
          setSel.call(selStanowisko, "Kucharz");
          selStanowisko.dispatchEvent(new Event("change", { bubbles: true }));
          await czekaj(200);
          const zapisyPrzed = window.__zapisy.length;
          klik("Dodaj i zacznij zmianę"); await czekaj(500);
          const rpc = window.__rpcWywolania.filter((w) => w[0] === "dodaj_probnego");
          sprawdz("osobę na próbę zakłada funkcja w bazie", rpc.length === 1,
            JSON.stringify(window.__rpcWywolania.map((w) => w[0])));
          sprawdz("zapytanie niesie imię, lokal i stanowisko",
            rpc.length === 1 && rpc[0][1].p_name === "Testowa Osoba" &&
              rpc[0][1].p_lokal === "Ceglana" && !!rpc[0][1].p_stanowisko,
            JSON.stringify(rpc[0] && rpc[0][1]));
          sprawdz("tablet nie pisze wprost do kartoteki",
            window.__zapisy.slice(zapisyPrzed).every((z) => z[0] !== "users"),
            JSON.stringify(window.__zapisy.slice(zapisyPrzed).map((z) => z[0])));
        }

        klik("Zmień"); await czekaj(300);
        klik("Emil"); await czekaj(300);
        sprawdz("stary wiersz (sam kiosk_pin) dalej jest zablokowany",
          widac("Ten profil jest zablokowany"),
          (document.getElementById("app").innerText || "").slice(0, 120));
      } catch (e) {
        sprawdz("przebieg bez wyjątku", false, e.message);
      }

      if (status.className !== "zle") {
        status.textContent = `Tablet Służbowy zamontowany — PIN ${zdanych}/${zdanych + oblanych}`;
      }
    })();
  } catch (e) { pokazBlad(e); }
})();
</script>
