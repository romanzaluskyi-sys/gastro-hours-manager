<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekrany pracownika — Raport i norma</title>
<!-- Montuje PersonalDashboard (osobisty telefon pracownika) z atrapą
     Supabase. Powstał dla bloku "norma miesięczna w Raporcie": ekran liczy
     normę z kalendarza i prognozę z wysłanego grafiku, a każda z tych liczb
     ma przypadek, w którym jej NIE MA (zlecenie, brak wymiaru etatu, miesiąc
     z przeszłości) — i wtedy blok ma zniknąć, a nie pokazać "null h".

     api/supabase jest PODMIENIONE na atrapę, nic nie leci do sieci. -->
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #F1F1EE; }
  #status { padding: 8px 14px; background: #17120F; color: #fff; font: 12px ui-monospace, monospace; }
  #status.zle { background: #DE3A22; }
  pre { background: #fff; padding: 12px; font-size: 12px; overflow-x: auto; }
</style>
<div id="status">ładowanie…</div>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
const status = document.getElementById("status");
const pokazBlad = (e) => {
  console.error("HARNESS", (e && e.stack) || e);
  status.className = "zle";
  status.textContent = "BŁĄD: " + (e && e.message ? e.message : e);
  const pre = document.createElement("pre");
  pre.textContent = (e && e.stack) || String(e);
  document.getElementById("app").appendChild(pre);
};
window.addEventListener("error", (ev) => pokazBlad(ev.error || ev.message));
window.addEventListener("unhandledrejection", (ev) => pokazBlad(ev.reason));

const IKONY = ["Sparkles", "Tag", "Truck", "Activity", "Repeat", "Coins", "Smartphone", "PieChart", "Search", "EyeOff", "Star", "Tablet", "Inbox", "Square", "Phone", "AlertCircle", "AlertTriangle", "Archive", "ArchiveRestore", "ArrowLeft", "ArrowLeftRight", "ArrowRight", "BarChart3", "Bell", "BookOpen", "Briefcase", "Calendar", "CalendarCheck", "CalendarDays", "CalendarRange", "Check", "CheckCircle", "CheckCircle2", "ChevronDown", "ChevronLeft", "ChevronRight", "ChevronUp", "ClipboardCheck", "ClipboardList", "ClipboardPlus", "Clock", "Cloud", "Construction", "Copy", "CopyPlus", "Delete", "Download", "Edit2", "Eye", "FileText", "Flag", "HelpCircle", "History", "Home", "Hourglass", "Info", "ListChecks", "Lock", "LogIn", "LogOut", "Mail", "MapPin", "MoreHorizontal", "Palmtree", "Pencil", "Plus", "Printer", "RefreshCw", "RotateCcw", "Save", "Send", "Settings", "SlidersHorizontal", "Thermometer", "Trash2", "User", "UserPlus", "Users", "Wallet", "WifiOff", "X"];
const stub = (kod) => URL.createObjectURL(new Blob([kod], { type: "text/javascript" }));

// Atrapa Supabase — nic nie leci do sieci, każdy zapis wraca z wymyślonym id.
window.__zapisy = [];
const API_STUB = stub(`
  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela) => (window.__tabele[tabela] || []).slice(),
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async () => true,
    patchByFilter: async () => true,
    // Zapis bez oddawania wiersza (return=minimal) — jak w prawdziwym api.
    dodajBezOdczytu: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push({ ...dane });
      return true;
    },
  };
`);

const PAKIETY = {
  react: stub(`const R = window.React;
    export default R;
    export const useState = R.useState, useMemo = R.useMemo, useEffect = R.useEffect,
      useRef = R.useRef, useCallback = R.useCallback, Fragment = R.Fragment;`),
  "lucide-react": stub(
    `const ikona = (n) => (p) => window.React.createElement("span", { "data-ikona": n }, "▪");
     ` + IKONY.map((n) => `export const ${n} = ikona("${n}");`).join("\n")
  ),
};

const cache = new Map();
async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await fetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const wczoraj = ymd(new Date(Date.now() - 86400000));
const godz = (h) => { const d = new Date(wczoraj + "T00:00:00"); d.setHours(h); return d; };
const poprzedniMiesiac = (h) => {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); d.setDate(10); d.setHours(h, 0, 0, 0);
  return d;
};

(async () => {
  try {
    const PD = (await import(await zaladuj("/src/components/PersonalDashboard"))).default;
    const { useState, createElement: h } = React;

    // Zmiany z bieżącego miesiąca (fakt) i przyszłe z grafiku (plan) — bez
    // obu tych zestawów nie da się sprawdzić ani "z normy", ani prognozy.
    const teraz = new Date();
    const wTymMiesiacu = (dzien, od, doGodz) => {
      const a = new Date(teraz.getFullYear(), teraz.getMonth(), dzien, od);
      const b = new Date(teraz.getFullYear(), teraz.getMonth(), dzien, doGodz);
      return { start_time: a, end_time: b };
    };
    const ymdMies = (dzien) =>
      `${teraz.getFullYear()}-${String(teraz.getMonth() + 1).padStart(2, "0")}-${String(dzien).padStart(2, "0")}`;
    // Dzień na tyle późny, żeby był po dzisiejszym w każdym miesiącu testowym.
    const przyszly = Math.min(28, teraz.getDate() + 2);

    const OSOBY = {
      etat: { id: "u1", name: "Bo", role: "closed", typ_umowy: "umowa_o_prace",
              wymiar_etatu: 1, wynagrodzenie_mies: 5200, default_lokal: "Ceglana",
              default_stanowisko: "Kucharz", active: true, archived: false },
      polEtatu: { id: "u2", name: "Cezary", role: "closed", typ_umowy: "umowa_o_prace",
              wymiar_etatu: 0.5, default_lokal: "Ceglana", default_stanowisko: "Kucharz",
              active: true, archived: false },
      zlecenie: { id: "u3", name: "Ala", role: "closed", typ_umowy: "zlecenie", stawka: 32,
              default_lokal: "Ceglana", default_stanowisko: "Kucharz",
              active: true, archived: false },
      bezDanych: { id: "u4", name: "Dorota", role: "closed", default_lokal: "Ceglana",
              default_stanowisko: "Kucharz", active: true, archived: false },
      // Zlecenie, ale grafik na resztę miesiąca jeszcze nie ułożony — wtedy
      // prognoza nie ma z czego powstać i blok ma o tym POWIEDZIEĆ, zamiast
      // pokazywać sam fakt jako "tyle wyjdzie".
      zlecenieBezGrafiku: { id: "u5", name: "Ewa", role: "closed", typ_umowy: "zlecenie",
              stawka: 30, default_lokal: "Ceglana", default_stanowisko: "Kucharz",
              active: true, archived: false },
    };

    function Harness() {
      const [kto, setKto] = useState("etat");
      const user = OSOBY[kto];
      const [shifts, setShifts] = useState([]);
      const [issues, setIssues] = useState([]);
      const [notifications, setNotifications] = useState([]);

      const wszystkieShifts = [1, 2, 3].map((d, idx) => ({
        id: "sh" + idx, user_id: user.id, user_name: user.name, lokal: "Ceglana",
        stanowisko: "Kucharz", ...wTymMiesiacu(d, 8, 16),
      }));
      // ?dzis=trwa / ?dzis=zamknieta — ten sam dzień raz jako zmiana w toku,
      // raz jako zakończona. Prognoza miesiąca MUSI w obu razach pokazać to
      // samo: wcześniej dzisiejszy dzień wypadał z faktu (bo zmiana nie ma
      // jeszcze godzin) i z planu (bo plan brał tylko dni PO dzisiejszym),
      // więc liczba rosła dopiero po zamknięciu zmiany i wyglądało to jak
      // zgubiony dzień.
      const trybDzis = new URLSearchParams(location.search).get("dzis");
      if (trybDzis) {
        const a = new Date(teraz.getFullYear(), teraz.getMonth(), teraz.getDate(), 9);
        wszystkieShifts.push({
          id: "shDzis", user_id: user.id, user_name: user.name, lokal: "Ceglana",
          stanowisko: "Kucharz", start_time: a,
          end_time:
            trybDzis === "zamknieta"
              ? new Date(teraz.getFullYear(), teraz.getMonth(), teraz.getDate(), 17)
              : null,
        });
      }
      // Poprzedni miesiąc obrobiony ponad normę — jedyny sposób, żeby zobaczyć
      // wariant "o X h ponad normę" (miesiąc zamknięty mówi o faktach, nie o
      // prognozie). Miesiąc PUSTY i zamknięty ma normy nie pokazywać wcale.
      for (let d = 1; d <= 24; d++) {
        const a = new Date(teraz.getFullYear(), teraz.getMonth() - 1, d, 8);
        const b = new Date(teraz.getFullYear(), teraz.getMonth() - 1, d, 16);
        wszystkieShifts.push({
          id: "pm" + d, user_id: user.id, user_name: user.name, lokal: "Ceglana",
          stanowisko: "Kucharz", start_time: a, end_time: b,
        });
      }

      const props = {
        currentUser: user,
        setCurrentView: () => {},
        lokale: [{ id: "l1", name: "Ceglana", miasto: "Koszalin", archived: false }],
        stanowiska: [{ id: "s1", name: "Kucharz", lokal_name: "Ceglana", archived: false }],
        shifts: wszystkieShifts,
        setShifts,
        issues, setIssues,
        notifications, setNotifications,
        tasks: [], taskBlocks: [], taskCompletions: [], setTaskCompletions: () => {},
        dayLogs: [], dayLogEntries: [], setDayLogEntries: () => {}, dayLogTemplates: [],
        absences: [], setAbsences: () => {},
        // Grafik wysłany: dwie przyszłe zmiany po 8 h — prognoza ma je dodać.
        planShifts: kto === "zlecenieBezGrafiku" ? [] : [
          // DZIŚ — dzień, który prognoza gubiła: odbicie jeszcze trwa, więc ma
          // zero godzin, a plan był odcinany warunkiem "> dziś". 8 h stąd MUSI
          // być w prognozie niezależnie od tego, czy zmiana jest zamknięta.
          // Dzień miniony — karty dni, które już były, mają być wyszarzone.
          { id: "pMin", user_id: user.id, user_name: user.name, lokal: "Ceglana",
            stanowisko: "Kucharz", date: ymdMies(1),
            start_time: "08:00", end_time: "16:00", published_at: "2020-01-01T00:00:00Z" },
          { id: "p0", user_id: user.id, user_name: user.name, lokal: "Ceglana",
            stanowisko: "Kucharz", date: ymdMies(teraz.getDate()),
            start_time: "09:00", end_time: "17:00", published_at: "2020-01-01T00:00:00Z" },
          { id: "p1", user_id: user.id, user_name: user.name, lokal: "Ceglana",
            stanowisko: "Kucharz", date: ymdMies(przyszly), start_time: "10:00",
            end_time: "18:00", published_at: "2020-01-01T00:00:00Z" },
          { id: "p2", user_id: user.id, user_name: user.name, lokal: "Ceglana",
            stanowisko: "Kucharz", date: ymdMies(Math.min(28, przyszly + 1)),
            start_time: "10:00", end_time: "18:00", published_at: "2020-01-01T00:00:00Z" },
        ],
        shiftSwaps: [], setShiftSwaps: () => {},
        showMsg: (m, t) => console.log("showMsg:", t, m),
      };

      return h("div", null,
        h("div", { style: { padding: "8px 14px", background: "#fff", borderBottom: "2px solid #171714" } },
          Object.keys(OSOBY).map((k) =>
            h("button", {
              key: k, onClick: () => setKto(k),
              style: {
                marginRight: 8, padding: "4px 10px", fontWeight: 700,
                border: "2px solid #171714", borderRadius: 4,
                background: k === kto ? "#171714" : "#fff",
                color: k === kto ? "#fff" : "#171714",
              },
            }, `${OSOBY[k].name} (${k})`)
          )
        ),
        // `key` — każda osoba to w aplikacji osobne konto i osobne montowanie;
        // bez tego miesiąc wybrany u jednej przechodził na następną.
        // Ramka telefonu tylko na wąskim ekranie — układ tabletu (md) liczy się
        // od szerokości OKNA, więc w ramce 430 px na szerokim oknie wychodził
        // ściśnięty tablet, którego nikt nigdy nie zobaczy.
        h("div", { style: { maxWidth: innerWidth < 768 ? 430 : "none", margin: "0 auto", height: "88vh" } }, h(PD, { ...props, key: kto }))
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(h(Harness));

    // ------------------------------------------------------------------
    // Raport (0.61.0) klikany automatycznie: każda osoba ma przypadek, w
    // którym jakiejś liczby NIE MA — i wtedy blok ma zniknąć, a nie pokazać
    // "null h". Wcześniej ten harness był tylko do oglądania.
    // ------------------------------------------------------------------
    const czekaj = (ms) => new Promise((r) => setTimeout(r, ms));
    const out = document.createElement("div");
    out.id = "out";
    out.style.cssText = "font: 12px ui-monospace, monospace; padding: 8px 14px; white-space: pre-wrap";
    document.body.insertBefore(out, document.getElementById("app"));
    let zdanych = 0, oblanych = 0;
    const sprawdz = (nazwa, warunek, szczegol = "") => {
      const d = document.createElement("div");
      if (warunek) { zdanych++; d.textContent = "  OK   " + nazwa; d.style.color = "#2C6A4F"; }
      else { oblanych++; d.className = "zle"; d.style.color = "#DE3A22";
             d.textContent = "  ŹLE  " + nazwa + (szczegol ? " — " + szczegol : ""); }
      out.appendChild(d);
    };
    const przycisk = (tekst) => [...document.querySelectorAll("#app button")]
      .find((b) => b.textContent.replace(/▪/g, "").trim() === tekst);
    const klikTekst = async (tekst) => {
      const b = przycisk(tekst);
      if (!b) throw new Error("nie znalazłem przycisku: " + tekst);
      b.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await czekaj(250);
    };
    const podsumowanie = () =>
      (document.querySelector("#app [data-raport-podsumowanie]") || {}).innerText || "";
    const osoba = async (k, imie) => {
      await klikTekst(`${imie} (${k})`);
      await klikTekst("Raport");
    };
    (async () => {
      try {
        await czekaj(600);
        await osoba("etat", "Bo");
        let t = podsumowanie();
        sprawdz("etat: kreska normy i fakt wobec normy",
          /norma \d/.test(t) && /(Do normy|Ponad normą|Dokładnie w normie)/.test(t), t.slice(0, 200));
        sprawdz("etat: prognoza „Z grafikiem wyjdzie”", /Z grafikiem wyjdzie/.test(t), t.slice(0, 200));
        sprawdz("etat: „Jeszcze w grafiku” pod listą zmian",
          /jeszcze w grafiku/i.test(document.getElementById("app").innerText));
        sprawdz("przy zmianie jest flaga korekty (48 px)",
          [...document.querySelectorAll('#app [aria-label^="Zgłoś korektę zmiany"]')]
            .some((b) => b.getBoundingClientRect().height >= 47));
        const wstecz = document.querySelector('#app [aria-label="Poprzedni miesiąc"]');
        wstecz.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        await czekaj(250);
        t = podsumowanie();
        sprawdz("etat, zamknięty miesiąc ponad normę: „Ponad normą … +X h”, bez prognozy",
          /zamknięty miesiąc/i.test(t) && /Ponad normą/.test(t) && !/Z grafikiem/.test(t), t.slice(0, 200));

        await osoba("polEtatu", "Cezary");
        t = podsumowanie();
        sprawdz("pół etatu: norma przeskalowana (mniejsza niż przy pełnym)",
          /norma \d/.test(t), t.slice(0, 200));

        await osoba("zlecenie", "Ala");
        t = podsumowanie();
        sprawdz("zlecenie: „bez normy”, pasek grafiku, bez kreski normy",
          /bez normy/.test(t) && /% grafiku/.test(t) && !/norma \d/.test(t), t.slice(0, 200));

        await osoba("zlecenieBezGrafiku", "Ewa");
        t = podsumowanie();
        sprawdz("zlecenie bez grafiku: bez paska „% grafiku”",
          /bez normy/.test(t) && !/% grafiku/.test(t), t.slice(0, 200));

        await osoba("bezDanych", "Dorota");
        t = podsumowanie();
        sprawdz("bez danych o umowie: ani normy, ani „bez normy”",
          !/norma/i.test(t), t.slice(0, 200));

        const calosc = document.getElementById("app").innerText;
        sprawdz("nigdzie nie ma „null”, „NaN” ani „undefined”", !/\b(null|NaN|undefined)\b/.test(calosc));
      } catch (e) {
        sprawdz("przebieg bez wyjątku", false, e.message);
      }
      const linia = document.createElement("div");
      linia.textContent = `ZDANYCH ${zdanych}, OBLANYCH ${oblanych}`;
      out.appendChild(linia);
      if (status.className !== "zle") {
        status.textContent = `Raport pracownika — ${zdanych}/${zdanych + oblanych}`;
        if (oblanych) status.className = "zle";
      }
    })();
  } catch (e) { pokazBlad(e); }
})();
</script>
