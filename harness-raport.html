<meta charset="utf-8">
<title>Ekrany pracownika — Raport i norma</title>
<!-- Montuje PersonalDashboard (osobisty telefon pracownika) z atrapą
     Supabase. Powstał dla bloku "norma miesięczna w Raporcie": ekran liczy
     normę z kalendarza i prognozę z wysłanego grafiku, a każda z tych liczb
     ma przypadek, w którym jej NIE MA (zlecenie, brak wymiaru etatu, miesiąc
     z przeszłości) — i wtedy blok ma zniknąć, a nie pokazać "null h".

     api/supabase jest PODMIENIONE na atrapę, nic nie leci do sieci. -->
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #F1F1EE; }
  #status { padding: 8px 14px; background: #17120F; color: #fff; font: 12px ui-monospace, monospace; }
  #status.zle { background: #DE3A22; }
  pre { background: #fff; padding: 12px; font-size: 12px; overflow-x: auto; }
</style>
<div id="status">ładowanie…</div>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
const status = document.getElementById("status");
const pokazBlad = (e) => {
  console.error("HARNESS", (e && e.stack) || e);
  status.className = "zle";
  status.textContent = "BŁĄD: " + (e && e.message ? e.message : e);
  const pre = document.createElement("pre");
  pre.textContent = (e && e.stack) || String(e);
  document.getElementById("app").appendChild(pre);
};
window.addEventListener("error", (ev) => pokazBlad(ev.error || ev.message));
window.addEventListener("unhandledrejection", (ev) => pokazBlad(ev.reason));

const IKONY = ["AlertCircle", "AlertTriangle", "Archive", "ArchiveRestore", "ArrowLeft", "ArrowLeftRight", "ArrowRight", "BarChart3", "Bell", "BookOpen", "Briefcase", "Calendar", "CalendarCheck", "CalendarDays", "CalendarRange", "Check", "CheckCircle", "CheckCircle2", "ChevronDown", "ChevronLeft", "ChevronRight", "ChevronUp", "ClipboardCheck", "ClipboardList", "ClipboardPlus", "Clock", "Cloud", "Construction", "Copy", "CopyPlus", "Delete", "Download", "Edit2", "Eye", "FileText", "Flag", "HelpCircle", "History", "Home", "Info", "Lock", "LogIn", "LogOut", "Mail", "MapPin", "MoreHorizontal", "Palmtree", "Pencil", "Plus", "Printer", "RefreshCw", "Save", "Send", "SlidersHorizontal", "Trash2", "User", "UserPlus", "Users", "WifiOff", "X"];
const stub = (kod) => URL.createObjectURL(new Blob([kod], { type: "text/javascript" }));

// Atrapa Supabase — nic nie leci do sieci, każdy zapis wraca z wymyślonym id.
window.__zapisy = [];
const API_STUB = stub(`
  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela) => (window.__tabele[tabela] || []).slice(),
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async () => true,
    patchByFilter: async () => true,
  };
`);

const PAKIETY = {
  react: stub(`const R = window.React;
    export default R;
    export const useState = R.useState, useMemo = R.useMemo, useEffect = R.useEffect,
      useRef = R.useRef, useCallback = R.useCallback, Fragment = R.Fragment;`),
  "lucide-react": stub(
    `const ikona = (n) => (p) => window.React.createElement("span", { "data-ikona": n }, "▪");
     ` + IKONY.map((n) => `export const ${n} = ikona("${n}");`).join("\n")
  ),
};

const cache = new Map();
async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await fetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const wczoraj = ymd(new Date(Date.now() - 86400000));
const godz = (h) => { const d = new Date(wczoraj + "T00:00:00"); d.setHours(h); return d; };
const poprzedniMiesiac = (h) => {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); d.setDate(10); d.setHours(h, 0, 0, 0);
  return d;
};

(async () => {
  try {
    const PD = (await import(await zaladuj("/src/components/PersonalDashboard"))).default;
    const { useState, createElement: h } = React;

    // Zmiany z bieżącego miesiąca (fakt) i przyszłe z grafiku (plan) — bez
    // obu tych zestawów nie da się sprawdzić ani "z normy", ani prognozy.
    const teraz = new Date();
    const wTymMiesiacu = (dzien, od, doGodz) => {
      const a = new Date(teraz.getFullYear(), teraz.getMonth(), dzien, od);
      const b = new Date(teraz.getFullYear(), teraz.getMonth(), dzien, doGodz);
      return { start_time: a, end_time: b };
    };
    const ymdMies = (dzien) =>
      `${teraz.getFullYear()}-${String(teraz.getMonth() + 1).padStart(2, "0")}-${String(dzien).padStart(2, "0")}`;
    // Dzień na tyle późny, żeby był po dzisiejszym w każdym miesiącu testowym.
    const przyszly = Math.min(28, teraz.getDate() + 2);

    const OSOBY = {
      etat: { id: "u1", name: "Bo", role: "closed", typ_umowy: "umowa_o_prace",
              wymiar_etatu: 1, wynagrodzenie_mies: 5200, default_lokal: "Ceglana",
              default_stanowisko: "Kucharz", active: true, archived: false },
      polEtatu: { id: "u2", name: "Cezary", role: "closed", typ_umowy: "umowa_o_prace",
              wymiar_etatu: 0.5, default_lokal: "Ceglana", default_stanowisko: "Kucharz",
              active: true, archived: false },
      zlecenie: { id: "u3", name: "Ala", role: "closed", typ_umowy: "zlecenie", stawka: 32,
              default_lokal: "Ceglana", default_stanowisko: "Kucharz",
              active: true, archived: false },
      bezDanych: { id: "u4", name: "Dorota", role: "closed", default_lokal: "Ceglana",
              default_stanowisko: "Kucharz", active: true, archived: false },
    };

    function Harness() {
      const [kto, setKto] = useState("etat");
      const user = OSOBY[kto];
      const [shifts, setShifts] = useState([]);
      const [issues, setIssues] = useState([]);
      const [notifications, setNotifications] = useState([]);

      const wszystkieShifts = [1, 2, 3].map((d, idx) => ({
        id: "sh" + idx, user_id: user.id, user_name: user.name, lokal: "Ceglana",
        stanowisko: "Kucharz", ...wTymMiesiacu(d, 8, 16),
      }));
      // Poprzedni miesiąc obrobiony ponad normę — jedyny sposób, żeby zobaczyć
      // wariant "o X h ponad normę" (miesiąc zamknięty mówi o faktach, nie o
      // prognozie). Miesiąc PUSTY i zamknięty ma normy nie pokazywać wcale.
      for (let d = 1; d <= 24; d++) {
        const a = new Date(teraz.getFullYear(), teraz.getMonth() - 1, d, 8);
        const b = new Date(teraz.getFullYear(), teraz.getMonth() - 1, d, 16);
        wszystkieShifts.push({
          id: "pm" + d, user_id: user.id, user_name: user.name, lokal: "Ceglana",
          stanowisko: "Kucharz", start_time: a, end_time: b,
        });
      }

      const props = {
        currentUser: user,
        setCurrentView: () => {},
        lokale: [{ id: "l1", name: "Ceglana", miasto: "Koszalin", archived: false }],
        stanowiska: [{ id: "s1", name: "Kucharz", lokal_name: "Ceglana", archived: false }],
        shifts: wszystkieShifts,
        setShifts,
        issues, setIssues,
        notifications, setNotifications,
        tasks: [], taskCompletions: [], setTaskCompletions: () => {},
        absences: [], setAbsences: () => {},
        // Grafik wysłany: dwie przyszłe zmiany po 8 h — prognoza ma je dodać.
        planShifts: [
          { id: "p1", user_id: user.id, user_name: user.name, lokal: "Ceglana",
            stanowisko: "Kucharz", date: ymdMies(przyszly), start_time: "10:00",
            end_time: "18:00", published_at: "2020-01-01T00:00:00Z" },
          { id: "p2", user_id: user.id, user_name: user.name, lokal: "Ceglana",
            stanowisko: "Kucharz", date: ymdMies(Math.min(28, przyszly + 1)),
            start_time: "10:00", end_time: "18:00", published_at: "2020-01-01T00:00:00Z" },
        ],
        shiftSwaps: [], setShiftSwaps: () => {},
        showMsg: (m, t) => console.log("showMsg:", t, m),
      };

      return h("div", null,
        h("div", { style: { padding: "8px 14px", background: "#fff", borderBottom: "2px solid #171714" } },
          Object.keys(OSOBY).map((k) =>
            h("button", {
              key: k, onClick: () => setKto(k),
              style: {
                marginRight: 8, padding: "4px 10px", fontWeight: 700,
                border: "2px solid #171714", borderRadius: 4,
                background: k === kto ? "#171714" : "#fff",
                color: k === kto ? "#fff" : "#171714",
              },
            }, `${OSOBY[k].name} (${k})`)
          )
        ),
        h("div", { style: { maxWidth: 430, margin: "0 auto", height: "88vh" } }, h(PD, props))
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(h(Harness));
    setTimeout(() => {
      if (status.className !== "zle") status.textContent = "ekrany pracownika zamontowane — wejdź w Raport";
    }, 400);
  } catch (e) { pokazBlad(e); }
})();
</script>
