};
window.addEventListener("error", (ev) => pokazBlad(ev.error || ev.message));

const IKONY = ["Coins", "Smartphone", "PieChart", "Search", "EyeOff", "Star", "Tablet", "Inbox", "Square", "Phone", "AlertCircle", "AlertTriangle", "Archive", "ArchiveRestore", "ArrowLeft", "ArrowLeftRight", "ArrowRight", "BarChart3", "Bell", "BookOpen", "Briefcase", "Calendar", "CalendarCheck", "CalendarDays", "CalendarRange", "Check", "CheckCircle", "CheckCircle2", "ChevronDown", "ChevronLeft", "ChevronRight", "ChevronUp", "ClipboardCheck", "ClipboardList", "ClipboardPlus", "Clock", "Cloud", "Construction", "Copy", "CopyPlus", "Delete", "Download", "Edit2", "Eye", "FileText", "Flag", "HelpCircle", "History", "Home", "Hourglass", "Info", "ListChecks", "Lock", "LogIn", "LogOut", "Mail", "MapPin", "MoreHorizontal", "Palmtree", "Pencil", "Plus", "Printer", "RefreshCw", "RotateCcw", "Save", "Send", "Settings", "SlidersHorizontal", "Thermometer", "Trash2", "User", "UserPlus", "Users", "Wallet", "WifiOff", "X"];

// Atrapa Supabase — nic nie leci do sieci, każdy zapis wraca z wymyślonym id.
window.__zapisy = [];
const API_STUB = stub(`
  // Atrapa trzyma dane w pamięci, więc api.get po zapisie zwraca to, co
  // zapisano — inaczej ekrany, które odświeżają się z bazy, wyglądałyby na
  // zepsute, choć są w porządku.
  window.__tabele = {};
  export const api = {
    get: async (tabela) => (window.__tabele[tabela] || []).slice(),
    post: async (tabela, dane) => {
      window.__zapisy.push([tabela, dane]);
      // Postgres dokłada domyślne znaczniki czasu — bez nich ekrany renderują
      // "Invalid Date" i wygląda to na błąd aplikacji, którym nie jest.
      const teraz = new Date().toISOString();
      const wiersz = { id: "fake-" + (window.__zapisy.length), created_at: teraz,
        recorded_at: teraz, completed_at: teraz, ...dane };
      (window.__tabele[tabela] = window.__tabele[tabela] || []).push(wiersz);
      return wiersz;
    },
    patch: async (tabela, id, dane) => {
      window.__zapisy.push([tabela, id, dane]);
      const lista = window.__tabele[tabela] || [];
      const i = lista.findIndex((w) => w.id === id);
      const wiersz = { ...(lista[i] || {}), id, ...dane };
      if (i >= 0) lista[i] = wiersz;
      return wiersz;
    },
    delete: async () => true,
    patchByFilter: async () => true,
  };
`);

const PAKIETY = {
  react: stub(`const R = window.React;

    export const useState = R.useState, useMemo = R.useMemo, useEffect = R.useEffect,

// ⚠️ Prawdziwy fetch zapamiętany PRZED podmianą: loader modułów pobiera nim
// pliki z /src. Podmieniamy WYŁĄCZNIE wywołania do GoTrue — reszta (ładowanie
// modułów) ma iść normalnie.
const prawdziwyFetch = window.fetch.bind(window);
const HASLO = "123456";
window.__logowania = [];
window.fetch = (url, opcje) => {
  const u = String(url);
  if (u.includes("/auth/v1/token")) {
    const body = JSON.parse((opcje && opcje.body) || "{}");
    window.__logowania.push(body.email);
    if (body.password !== HASLO) {
      return Promise.resolve({ ok: false, status: 400, json: async () => ({ error: "invalid_grant" }) });
    }
    return Promise.resolve({ ok: true, status: 200, json: async () => ({
      access_token: "dostep", refresh_token: "odswiez", expires_in: 3600,
      user: { id: "auth-1", email: body.email },
    }) });
  }
  if (u.includes("/auth/v1/logout")) return Promise.resolve({ ok: true, status: 204, json: async () => ({}) });
  return prawdziwyFetch(url, opcje);
};

const cache = new Map();
async function zaladuj(sciezka) {
  if (sciezka.endsWith("/api/supabase")) return API_STUB;
  if (cache.has(sciezka)) return cache.get(sciezka);
  const p = (async () => {
    let kod = null;
    for (const ext of [".tsx", ".ts", ""]) {
      const r = await prawdziwyFetch(sciezka + ext + "?cb=" + Date.now());
      if (r.ok) { kod = await r.text(); break; }
    }
    if (kod === null) throw new Error("nie znaleziono " + sciezka);
    const baza = sciezka.slice(0, sciezka.lastIndexOf("/"));
    const spec = [...kod.matchAll(/from\s+"([^"]+)"/g)].map((m) => m[1]);
    const mapa = {};
    for (const s of spec) {
      mapa[s] = PAKIETY[s] ? PAKIETY[s]
        : await zaladuj(new URL(baza + "/" + s, location.origin).pathname);
    }
    kod = kod.replace(/from\s+"([^"]+)"/g, (m, s) => `from "${mapa[s]}"`);
    return URL.createObjectURL(new Blob([
      Babel.transform(kod, { presets: [["typescript", { allExtensions: true, isTSX: true }], "react"] }).code
    ], { type: "text/javascript" }));
  })();
  cache.set(sciezka, p);
  return p;
}

(async () => {
  try {
    localStorage.removeItem("shiftro_auth");

    const LS = (await import(await zaladuj("/src/components/LoginScreen"))).default;

    // ⚠️ DOPIERO PO imporcie. Atrapa `api/supabase` przy ładowaniu ustawia
    // `window.__tabele` od zera, więc kartoteka wpisana wcześniej znikała —
    // a logowanie kończyło się komunikatem "konto nie jest powiązane".
    window.__tabele = window.__tabele || {};
    // ⚠️ `users_widok`, nie `users`: od migracji 0029 `wczytajKonto` pyta o
    // kartotekę przez widok, bo tabela wydaje wiersz wyłącznie właścicielowi
    // konta i kierownikom. Klucz `users` zostawiony w atrapie przepuściłby
    // powrót do starego odczytu bez słowa.
    window.__tabele.users_widok = [
      { id: "u9", name: "Roman", role: "manager_lokalu", active: true, archived: false,
        allowed_lokale: "Ceglana", auth_id: "auth-1" },
    ];
    const { createElement: h } = React;
    const zalogowany = [];
    const widoki = [];
    ReactDOM.createRoot(document.getElementById("app")).render(
      h("div", { style: { padding: 20 } },
        h(LS, {
          setCurrentUser: (u) => zalogowany.push(u),
          setCurrentView: (w) => widoki.push(w),
          dbError: null,
        }))
    );

    // --- sprawdziany ---
    let zdanych = 0, oblanych = 0;
    const wyniki = document.createElement("div");
    wyniki.style.cssText = "padding:8px 16px;font:12px ui-monospace,monospace;background:#F1EEEB";
    document.body.insertBefore(wyniki, document.getElementById("app"));
    const sprawdz = (nazwa, warunek, szczegol = "") => {
      const d = document.createElement("div");
      if (warunek) { zdanych++; d.textContent = "  OK   " + nazwa; d.style.color = "#2C6A4F"; }
      else { oblanych++; d.className = "zle"; d.style.color = "#DE3A22";
             d.textContent = "  ŹLE  " + nazwa + (szczegol ? " — " + szczegol : ""); }
      wyniki.appendChild(d);
    };
    const czekaj = (ms) => new Promise((r) => setTimeout(r, ms));
    const wpisz = (typ, wartosc) => {
      const pole = document.querySelector(`input[type=${typ}]`);
      const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
      setter.call(pole, wartosc);
      pole.dispatchEvent(new Event("input", { bubbles: true }));
    };
    const zaloguj = () => document.querySelector("form").dispatchEvent(
      new Event("submit", { bubbles: true, cancelable: true }));

    await czekaj(400);
    sprawdz("ekran się zamontował", !!document.querySelector("form"));

    // ⚠️ Najważniejsze w tej wersji: hasło sprawdza SERWER. Ekran nie dostaje
    // już tabeli `users` z PIN-ami wszystkich, więc nie ma jak porównać sam.
    wpisz("email", "roman@x.pl"); wpisz("password", "000000");
    zaloguj(); await czekaj(400);
    sprawdz("złe hasło nie wpuszcza", zalogowany.length === 0);
    sprawdz("i mówi o tym po polsku",
      (document.getElementById("app").innerText || "").includes("Nieprawidłowe dane"));

    wpisz("password", "123456");
    zaloguj(); await czekaj(500);
    sprawdz("dobre hasło loguje", zalogowany.length === 1, JSON.stringify(zalogowany));
    sprawdz("zalogowany to wiersz z kartoteki, nie z Auth",
      zalogowany[0] && zalogowany[0].name === "Roman" && zalogowany[0].role === "manager_lokalu");

      window.__logowania[window.__logowania.length - 1] === "roman@x.pl");

    if (status.className !== "zle") {
      status.textContent = `ekran logowania zamontowany — logowanie ${zdanych}/${zdanych + oblanych}`;
